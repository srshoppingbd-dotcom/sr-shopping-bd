<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SR Shopping BD</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#222;
}

/* COVER IMAGE */

.cover-header{
 width:100%;
 background:#fff;
 overflow:hidden;
}

.cover-header img{
 width:100%;
 display:block;
}

/* TOP BOX */

.bismillah-box{
 margin:15px 10px;
 padding:15px;
 text-align:center;
 background:linear-gradient(135deg,#fff7d6,#f5fff5);
 border:2px solid #c9a227;
 border-radius:14px;
}

.bismillah{
 font-size:22px;
 font-weight:bold;
 color:#008000;
 direction:rtl;
}

.allah-vorsa{
 margin-top:8px;
 font-size:20px;
 font-weight:bold;
 color:#8a2be2;
}

/* SHOP TITLE */

.shop-title{
 margin:15px 10px;
 padding:15px;
 background:#fff;
 border-radius:12px;
 border:2px solid #111;
 text-align:center;
}

.shop-title h1{
 margin:0;
 font-size:26px;
}

.shop-title p{
 color:#666;
}

/* SEARCH */

.search-box{
 padding:10px;
}

.search-box input{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:1px solid #ccc;
 font-size:16px;
}

/* PRODUCTS */

.container{
 max-width:1100px;
 margin:auto;
 padding:10px;
}

.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.product-card{
 background:#fff;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.product-image{
 width:100%;
 height:220px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#fff;
}

.product-image img{
 width:100%;
 height:100%;
 object-fit:contain;
}

.product-info{
 padding:12px;
}

.product-name{
 font-size:17px;
 font-weight:bold;
}

.product-price{
 font-size:20px;
 font-weight:bold;
 margin:8px 0;
}

</style>
</head>

<body>

<header class="cover-header">

<img src="cover.jpg" alt="SR Shopping BD">

</header>

<section class="bismillah-box">

<div class="bismillah">
بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
</div>

<div class="allah-vorsa">
🤲 আল্লাহ ভরসা 🤲
</div>

</section>
  <section class="shop-title">

<h1>🛍️ SR Shopping BD</h1>

<p>
আপনার পছন্দের পণ্যগুলো একসাথে দেখুন
</p>

</section>


<div class="container">

<div class="search-box">

<input 
type="text"
id="searchInput"
placeholder="🔍 পণ্য খুঁজুন..."
onkeyup="searchProduct()">

</div>


<div id="loading"
style="text-align:center;padding:30px;">
পণ্য লোড হচ্ছে...
</div>


<div id="error"
style="display:none;text-align:center;color:red;">
</div>


<div id="products"
class="products">

</div>


</div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";


let allProducts = [];



function loadProducts(){


const callbackName =
"productsCallback_"+Date.now();



window[callbackName]=function(result){


delete window[callbackName];


document.getElementById("loading")
.style.display="none";


if(result && result.success){


allProducts=result.products || [];


displayProducts(allProducts);


}

else{


document.getElementById("error")
.style.display="block";


document.getElementById("error")
.innerHTML="পণ্য লোড করা যাচ্ছে না।";


}



};



const script=document.createElement("script");


script.src=
API_URL+
"?action=products"+
"&callback="+callbackName+
"&time="+Date.now();



document.body.appendChild(script);



}




function displayProducts(products){


const box =
document.getElementById("products");


box.innerHTML="";



products.forEach(function(product){



let image="";


if(product.image1){

image=product.image1;

}



const card=document.createElement("div");


card.className="product-card";



card.innerHTML=


`
<div class="product-image">

<img src="${image}"
alt="${product.name}">

</div>


<div class="product-info">


<div class="product-name">

${product.name || ""}

</div>


<div class="product-price">

৳${Number(product.price||0)
.toLocaleString("en-BD")}

</div>


<button
style="
width:100%;
padding:12px;
background:#111;
color:#fff;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer;
"

onclick="buyNow(
'${product.name}',
'${product.price}',
'${image}'
)">

🛒 ORDER NOW

</button>



</div>
`;



box.appendChild(card);



});



}




function buyNow(name,price,image){


window.location.href=

"order.html?product="+
encodeURIComponent(name)+

"&price="+
encodeURIComponent(price)+

"&image="+
encodeURIComponent(image);



}




function searchProduct(){


const value=
document.getElementById("searchInput")
.value
.toLowerCase();



const filtered =
allProducts.filter(function(p){


return (
p.name || ""
)
.toLowerCase()
.includes(value);



});



displayProducts(filtered);



}



loadProducts();



</script>


</body>
</html>
