<!DOCTYPE html>

<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SR Shopping BD</title>


<style>


*{

box-sizing:border-box;

} 



body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}





/* COVER */


.cover-header{

width:100%;

overflow:hidden;

background:#fff;

}



.cover-header img{

width:100%;

display:block;

}





/* BISMILLAH */


.bismillah-box{

margin:15px 10px;

padding:18px;

text-align:center;

background:linear-gradient(135deg,#fff7d6,#f5fff5);

border:2px solid #c9a227;

border-radius:14px;

}





.bismillah{

font-size:24px;

font-weight:bold;

color:#008000;

direction:rtl;

}



.allah-vorsa{

margin-top:10px;

font-size:21px;

font-weight:bold;

color:#8a2be2;

}





/* TITLE */


.shop-title{

margin:15px 10px;

padding:18px;

background:#fff;

border:2px solid #111;

border-radius:14px;

text-align:center;

}





.shop-title h1{

margin:0;

font-size:28px;

}





.shop-title p{

margin-top:8px;

color:#555;

font-size:17px;

}





/* CONTAINER */


.container{

max-width:1100px;

margin:auto;

padding:10px;

}





/* SEARCH */


.search-box{

margin-bottom:15px;

}





.search-box input{

width:100%;

padding:15px;

border-radius:12px;

border:1px solid #ccc;

font-size:17px;

}





/* PRODUCTS */


.products{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}





.product-card{

background:#fff;

border-radius:14px;

overflow:hidden;

box-shadow:0 3px 12px rgba(0,0,0,.10);

display:flex;

flex-direction:column;

height:100%;

}





.product-image{

height:220px;

background:#fff;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}





.product-image img{

width:100%;

height:100%;

object-fit:contain;

display:block;

}





.loading-image{

font-size:14px;

color:#999;

text-align:center;

}



.product-info{

padding:12px;

display:flex;

flex-direction:column;

flex:1;

}
  /* PRODUCT DETAILS */


.product-name{

font-size:19px;

font-weight:bold;

}





.product-description{

font-size:15px;

color:#666;

line-height:1.5;

margin:8px 0;

}





.product-price{

font-size:22px;

font-weight:bold;

margin:12px 0;

}







/* ORDER BUTTON */


.order-button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#111;

color:#fff;

font-size:17px;

font-weight:bold;

cursor:pointer;

margin-top:auto;

}







/* SHARE */


.share-buttons{

display:flex;

gap:5px;

margin-top:10px;

}






.share-buttons button{

flex:1;

padding:9px 3px;

border:none;

border-radius:7px;

color:white;

font-size:12px;

font-weight:bold;

}





.facebook{

background:#1877f2;

}





.whatsapp{

background:#25d366;

}





.copy{

background:#555;

}







@media(max-width:600px){


.products{

grid-template-columns:repeat(2,1fr);

}



.product-image{

height:190px;

}



}



</style>


</head>




<body>





<header class="cover-header">


<img src="cover.jpg" alt="SR Shopping BD">


</header>







<section class="bismillah-box">



<div class="bismillah">


بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ


</div>



<div class="allah-vorsa">


🤲 আল্লাহ ভরসা 🤲


</div>



</section>







<section class="shop-title">


<h1>

🛍️ SR Shopping BD

</h1>



<p>

আপনার পছন্দের পণ্যগুলো একসাথে দেখুন

</p>



</section>







<div class="container">





<div class="search-box">


<input

id="searchInput"

placeholder="🔍 Search Product..."

>



</div>






<div id="loading"

style="text-align:center;padding:30px;">

Image Loading Now...

</div>






<div id="products" class="products"></div>




<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let allProducts = [];





// LOAD PRODUCTS


function loadProducts(){


const callbackName =

"productsCallback_" + Date.now();





window[callbackName] = function(result){


delete window[callbackName];



document.getElementById("loading")

.style.display="none";




if(result && result.success){


allProducts = result.products || [];



displayProducts(allProducts);



}

else{


document.getElementById("products").innerHTML =

"<p style='text-align:center'>Product পাওয়া যায়নি</p>";



}



};






const script =

document.createElement("script");



script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();






document.body.appendChild(script);



  }
  // DISPLAY PRODUCTS


function displayProducts(products){


const box =

document.getElementById("products");



box.innerHTML="";





products.forEach(function(product){



let imageURL="";



if(product.image1){


imageURL = convertImageURL(product.image1);


}






let imageHTML =

`

<div class="loading-image">

Image Loading Now...

</div>


<img

src="${imageURL}"

alt="${product.name || ''}"

style="display:none;"

onload="this.previousElementSibling.style.display='none'; this.style.display='block';"

onerror="this.previousElementSibling.innerHTML='Image Loading Error';"

>

`;







const card =

document.createElement("div");



card.className="product-card";






card.innerHTML = `



<div class="product-image">


${imageHTML}


</div>





<div class="product-info">



<div class="product-name">

${product.name || ""}

</div>




<div class="product-description">

${product.description || ""}

</div>





<div class="product-price">

৳${Number(product.price || 0).toLocaleString("en-BD")}

</div>





<button

class="order-button"

onclick="orderProduct(

'${escapeText(product.name)}',

'${product.price}',

'${imageURL}'

)"

>

🛒 ORDER NOW

</button>






<div class="share-buttons">



<button

class="facebook"

onclick="shareFacebook(

'${escapeText(product.name)}'

)"

>

📘 FB

</button>





<button

class="whatsapp"

onclick="shareWhatsApp(

'${escapeText(product.name)}'

)"

>

🟢 WhatsApp

</button>






<button

class="copy"

onclick="copyProductLink(

'${escapeText(product.name)}'

)"

>

🔗 Copy

</button>



</div>




</div>



`;





box.appendChild(card);



});



}








// GOOGLE DRIVE IMAGE CONVERTER


function convertImageURL(url){


if(!url){

return "";

}



url = String(url).trim();



let id="";



let match =

url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id = match[1];

}





if(!id){


match =

url.match(/[?&]id=([^&]+)/);



if(match && match[1]){

id = match[1];

}


}





if(id){


return "https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w600";


}



return url;


}







// ORDER PRODUCT


function orderProduct(name,price,image){


window.location.href =

"order.html?product="

+

encodeURIComponent(name)

+

"&price="

+

encodeURIComponent(price)

+

"&image="

+

encodeURIComponent(image);



}







// CREATE PRODUCT LINK


function getProductLink(name){


let baseUrl =

window.location.origin

+

window.location.pathname;



baseUrl =

baseUrl.substring(

0,

baseUrl.lastIndexOf("/") + 1

);



return baseUrl

+

"product.html?product="

+

encodeURIComponent(name);



}







// FACEBOOK


function shareFacebook(name){


let link =

getProductLink(name);



window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(link),

"_blank"

);



}







// WHATSAPP


function shareWhatsApp(name){


let link =

getProductLink(name);



let text =

"🛍️ SR Shopping BD\n\n"

+

name

+

"\n\nঅর্ডার করতে ভিজিট করুন:\n"

+

link;



window.open(

"https://wa.me/?text="

+

encodeURIComponent(text),

"_blank"

);



}







// COPY


function copyProductLink(name){


let link =

getProductLink(name);



navigator.clipboard.writeText(link);



alert(

"Product Link Copy হয়েছে"

);



}








// ESCAPE


function escapeText(value){


return String(value || "")

.replace(/'/g,"&#39;")

.replace(/"/g,"&quot;");


}







// SEARCH


document

.getElementById("searchInput")

.addEventListener(

"keyup",

function(){



let text =

this.value.toLowerCase();





let result =

allProducts.filter(function(item){



return String(item.name || "")

.toLowerCase()

.includes(text);



});




displayProducts(result);



}

);







// START


loadProducts();



</script>






</div>






</body>

</html>
