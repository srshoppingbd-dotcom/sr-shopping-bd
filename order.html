<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>অর্ডার করুন - SR Shopping BD</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  text-align: center;
  padding: 20px 15px;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 6px 0 0;
  font-size: 14px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 15px;
}

.back-button {
  display: inline-block;
  margin-bottom: 15px;
  text-decoration: none;
  color: #111;
  font-weight: bold;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.product-box {
  background: #f3f3f3;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
}

.product-box h2 {
  margin: 0 0 8px;
  font-size: 21px;
}

.product-price {
  font-size: 22px;
  font-weight: bold;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.summary {
  background: #f7f7f7;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
}

.summary-total {
  border-top: 1px solid #ccc;
  margin-top: 8px;
  padding-top: 12px;
  font-size: 21px;
  font-weight: bold;
}

.confirm-button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 16px;
  margin-top: 20px;
  background: #111;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.confirm-button:disabled {
  opacity: 0.6;
}

.loading {
  text-align: center;
  padding: 40px 15px;
}

.error {
  color: #c62828;
  margin-top: 12px;
  text-align: center;
}

.success {
  display: none;
  background: white;
  border-radius: 12px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.success h2 {
  margin-top: 0;
}

.success-button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 14px;
  margin-top: 20px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

</style>

</head>


<body>


<header>

<h1>SR Shopping BD</h1>

<p>অর্ডার করুন</p>

</header>


<div class="container">


<a href="index.html"
class="back-button">

← পণ্যের তালিকায় ফিরে যান

</a>


<div id="loading"
class="loading">

পণ্যের তথ্য লোড হচ্ছে...

</div>


<div id="error"
class="error"
style="display:none;">
</div>


<div id="orderSection"
style="display:none;">


<div class="card">


<div class="product-box">

<h2 id="productName">
পণ্য
</h2>

<div class="product-price">

৳<span id="productPrice">0</span>

</div>

</div>


<form id="orderForm">


<label>
পরিমাণ *
</label>

<input
type="number"
id="quantity"
value="1"
min="1"
required>


<label>
আপনার নাম *
</label>

<input
type="text"
id="customerName"
placeholder="আপনার নাম লিখুন"
required>


<label>
মোবাইল নম্বর *
</label>

<input
type="tel"
id="phone"
placeholder="01XXXXXXXXX"
inputmode="numeric"
required>


<label>
ডেলিভারি এলাকা *
</label>

<select
id="deliveryArea"
required>

<option value="ঢাকার ভিতরে">
ঢাকার ভিতরে
</option>

<option value="ঢাকার বাইরে">
ঢাকার বাইরে
</option>

</select>


<label>
সম্পূর্ণ ঠিকানা *
</label>

<textarea
id="address"
placeholder="বাসা, রোড, এলাকা, থানা/উপজেলা লিখুন"
required></textarea>


<label>
অতিরিক্ত তথ্য (ঐচ্ছিক)
</label>

<textarea
id="remarks"
placeholder="প্রয়োজন হলে অতিরিক্ত তথ্য লিখুন"></textarea>


<div class="summary">


<div class="summary-row">

<span>
পণ্যের মূল্য
</span>

<span>
৳<span id="productTotal">0</span>
</span>

</div>


<div class="summary-row">

<span>
ডেলিভারি চার্জ
</span>

<span>
৳<span id="deliveryCharge">60</span>
</span>

</div>


<div class="summary-row summary-total">

<span>
সর্বমোট
</span>

<span>
৳<span id="totalPrice">0</span>
</span>

</div>


</div>


<button
type="submit"
id="confirmButton"
class="confirm-button">

🛒 অর্ডার কনফার্ম করুন

</button>


<div id="formError"
class="error">
</div>


</form>


</div>

</div>


<div id="success"
class="success">

<h2>✅ অর্ডার সফল হয়েছে!</h2>

<p>
আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।
</p>

<p>
আমরা খুব শীঘ্রই আপনার সাথে যোগাযোগ করব।
</p>


<button
class="success-button"
onclick="window.location.href='index.html'">

আরও পণ্য দেখুন

</button>

</div>


</div>


<script>


// ==========================================
// APPS SCRIPT URL
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";


// ==========================================
// VARIABLES
// ==========================================

let selectedProduct = null;

let dhakaDelivery = 60;

let outsideDelivery = 120;


// ==========================================
// PRODUCT FROM URL
// ==========================================

const urlParams =
new URLSearchParams(
window.location.search
);


const productNameFromURL =
urlParams.get("product");


// ==========================================
// LOAD PRODUCT
// ==========================================

function loadProduct() {

  if (!productNameFromURL) {

    showError(
      "কোনো পণ্য নির্বাচন করা হয়নি।"
    );

    return;

  }


  const callbackName =
    "productCallback_" +
    Date.now();


  window[callbackName] =
  function(result) {

    try {

      delete window[callbackName];


      if (
        !result ||
        result.success !== true
      ) {

        showError(
          result &&
          result.error
            ? result.error
            : "পণ্যের তথ্য পাওয়া যায়নি।"
        );

        return;

      }


      const products =
        result.products || [];


      for (
        let i = 0;
        i < products.length;
        i++
      ) {

        if (
          products[i].name ===
          productNameFromURL
        ) {

          selectedProduct =
            products[i];


          showProduct();


          loadSettings();


          return;

        }

      }


      showError(
        "এই পণ্যটি বর্তমানে পাওয়া যাচ্ছে না।"
      );

    }

    catch(error) {

      showError(
        "পণ্যের তথ্য লোড করতে সমস্যা হয়েছে।"
      );

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=products" +
    "&callback=" +
    callbackName +
    "&time=" +
    Date.now();


  script.onerror =
  function() {

    delete window[callbackName];

    showError(
      "Google Sheet থেকে পণ্যের তথ্য পাওয়া যাচ্ছে না।"
    );

  };


  document.body.appendChild(script);

}


// ==========================================
// SHOW PRODUCT
// ==========================================

function showProduct() {

  document
  .getElementById("loading")
  .style.display = "none";


  document
  .getElementById("orderSection")
  .style.display = "block";


  document
  .getElementById("productName")
  .textContent =
    selectedProduct.name;


  document
  .getElementById("productPrice")
  .textContent =
    Number(
      selectedProduct.price
    ).toLocaleString("en-BD");


  updateTotal();

}


// ==========================================
// LOAD SETTINGS
// ==========================================

function loadSettings() {

  const callbackName =
    "settingsCallback_" +
    Date.now();


  window[callbackName] =
  function(result) {

    try {

      delete window[callbackName];


      if (
        result &&
        result.success === true &&
        result.settings
      ) {

        dhakaDelivery =
          Number(
            result.settings.dhaka
          ) || 60;


        outsideDelivery =
          Number(
            result.settings.outsideDhaka
          ) || 120;

      }


      updateTotal();

    }

    catch(error) {

      updateTotal();

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=settings" +
    "&callback=" +
    callbackName +
    "&time=" +
    Date.now();


  script.onerror =
  function() {

    delete window[callbackName];

    updateTotal();

  };


  document.body.appendChild(script);

}


// ==========================================
// UPDATE TOTAL
// ==========================================

function updateTotal() {

  if (!selectedProduct) {
    return;
  }


  const quantity =
    Number(
      document
      .getElementById("quantity")
      .value
    ) || 1;


  const productPrice =
    Number(
      selectedProduct.price
    ) || 0;


  const productTotal =
    productPrice *
    quantity;


  const area =
    document
    .getElementById("deliveryArea")
    .value;


  let deliveryCharge;


  if (
    area ===
    "ঢাকার বাইরে"
  ) {

    deliveryCharge =
      outsideDelivery;

  }

  else {

    deliveryCharge =
      dhakaDelivery;

  }


  const total =
    productTotal +
    deliveryCharge;


  document
  .getElementById("productTotal")
  .textContent =
    productTotal.toLocaleString("en-BD");


  document
  .getElementById("deliveryCharge")
  .textContent =
    deliveryCharge.toLocaleString("en-BD");


  document
  .getElementById("totalPrice")
  .textContent =
    total.toLocaleString("en-BD");

}


// ==========================================
// INPUT EVENTS
// ==========================================

document
.getElementById("quantity")
.addEventListener(
  "input",
  updateTotal
);


document
.getElementById("deliveryArea")
.addEventListener(
  "change",
  updateTotal
);


// ==========================================
// FORM SUBMIT
// ==========================================

document
.getElementById("orderForm")
.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    const customerName =
      document
      .getElementById("customerName")
      .value
      .trim();


    const phone =
      document
      .getElementById("phone")
      .value
      .trim();


    const address =
      document
      .getElementById("address")
      .value
      .trim();


    const quantity =
      Number(
        document
        .getElementById("quantity")
        .value
      ) || 1;


    const deliveryArea =
      document
      .getElementById("deliveryArea")
      .value;


    const remarks =
      document
      .getElementById("remarks")
      .value
      .trim();


    const formError =
      document
      .getElementById("formError");


    formError.textContent = "";


    if (!customerName) {

      formError.textContent =
        "আপনার নাম লিখুন।";

      return;

    }


    if (!phone) {

      formError.textContent =
        "মোবাইল নম্বর লিখুন।";

      return;

    }


    if (!address) {

      formError.textContent =
        "সম্পূর্ণ ঠিকানা লিখুন।";

      return;

    }


    if (quantity < 1) {

      formError.textContent =
        "পরিমাণ কমপক্ষে ১ হতে হবে।";

      return;

    }


    const button =
      document
      .getElementById(
        "confirmButton"
      );


    button.disabled = true;

    button.textContent =
      "অর্ডার পাঠানো হচ্ছে...";


    submitOrder({

      customerName:
        customerName,

      phone:
        phone,

      address:
        address,

      productName:
        selectedProduct.name,

      quantity:
        quantity,

      deliveryArea:
        deliveryArea,

      remarks:
        remarks

    });

  }
);


// ==========================================
// SUBMIT ORDER
// ==========================================

function submitOrder(order) {

  const callbackName =
    "orderCallback_" +
    Date.now();


  window[callbackName] =
  function(result) {

    try {

      delete window[callbackName];


      const button =
        document
        .getElementById(
          "confirmButton"
        );


      if (
        result &&
        result.success === true
      ) {

        document
        .getElementById(
          "orderSection"
        )
        .style.display =
          "none";


        document
        .getElementById(
          "success"
        )
        .style.display =
          "block";


        return;

      }


      button.disabled = false;

      button.textContent =
        "🛒 অর্ডার কনফার্ম করুন";


      document
      .getElementById(
        "formError"
      )
      .textContent =
        result &&
        (result.error || result.message)
          ? (result.error || result.message)
          : "অর্ডার পাঠানো যায়নি।";

    }

    catch(error) {

      showSubmitError();

    }

  };


  const params =
    new URLSearchParams();


  params.append(
    "action",
    "saveOrder"
  );


  params.append(
    "callback",
    callbackName
  );


  params.append(
    "customerName",
    order.customerName
  );


  params.append(
    "phone",
    order.phone
  );


  params.append(
    "address",
    order.address
  );


  params.append(
    "productName",
    order.productName
  );


  params.append(
    "quantity",
    order.quantity
  );


  params.append(
    "deliveryArea",
    order.deliveryArea
  );


  params.append(
    "remarks",
    order.remarks
  );


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?" +
    params.toString();


  script.onerror =
  function() {

    delete window[callbackName];

    showSubmitError();

  };


  document.body.appendChild(script);

}


// ==========================================
// SUBMIT ERROR
// ==========================================

function showSubmitError() {

  const button =
    document
    .getElementById(
      "confirmButton"
    );


  button.disabled = false;

  button.textContent =
    "🛒 অর্ডার কনফার্ম করুন";


  document
  .getElementById(
    "formError"
  )
  .textContent =
    "অর্ডার পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";

}


// ==========================================
// GENERAL ERROR
// ==========================================

function showError(message) {

  document
  .getElementById("loading")
  .style.display =
    "none";


  document
  .getElementById("error")
  .style.display =
    "block";


  document
  .getElementById("error")
  .textContent =
    message;

}


// ==========================================
// START
// ==========================================

loadProduct();

</script>


</body>

  </html>
