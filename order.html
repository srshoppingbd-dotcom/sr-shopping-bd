<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>অর্ডার করুন - SR Shopping BD</title>


<style>

*{
box-sizing:border-box;
}


body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}


header{

background:#111;
color:white;
text-align:center;
padding:20px 15px;

}


header h1{

margin:0;
font-size:27px;

}


header p{

margin:6px 0 0;

}



.container{

max-width:650px;

margin:auto;

padding:15px;

}



.back-button{

display:inline-block;

margin-bottom:15px;

text-decoration:none;

color:#111;

font-weight:bold;

}




.card{

background:white;

border-radius:14px;

padding:20px;

box-shadow:0 3px 12px rgba(0,0,0,.10);

}





/* PRODUCT IMAGE */


.product-photo-box{

width:100%;

height:350px;

background:#fff;

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

border:1px solid #eee;

margin-bottom:15px;

}



.product-photo{

width:100%;

height:100%;

object-fit:contain;

}



.no-image{

color:#999;

font-size:16px;

}





.product-box{

background:#f3f3f3;

padding:15px;

border-radius:10px;

margin-bottom:20px;

}


.product-box h2{

margin:0 0 10px;

font-size:22px;

}


.product-price{

font-size:24px;

font-weight:bold;

}





label{

display:block;

margin-top:15px;

margin-bottom:6px;

font-weight:bold;

}



input,
select,
textarea{

width:100%;

padding:13px;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

}


textarea{

min-height:90px;

resize:vertical;

}





.payment-box{

background:#fafafa;

border:1px solid #ddd;

border-radius:10px;

padding:15px;

margin-top:15px;

}



.payment-option{

display:flex;

align-items:center;

gap:8px;

margin:12px 0;

}



.bkash-box{

display:none;

background:#fff0f5;

border:1px solid #e91e63;

border-radius:10px;

padding:15px;

margin-top:10px;

}


.bkash-number{

font-size:20px;

font-weight:bold;

color:#d81b60;

}





.summary{

background:#f7f7f7;

padding:15px;

border-radius:10px;

margin-top:20px;

}


.summary-row{

display:flex;

justify-content:space-between;

padding:7px 0;

}


.summary-total{

border-top:1px solid #ccc;

margin-top:8px;

padding-top:12px;

font-size:21px;

font-weight:bold;

}





.confirm-button{

width:100%;

border:0;

border-radius:10px;

padding:16px;

margin-top:20px;

background:#111;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}





.error{

color:red;

text-align:center;

margin-top:10px;

}




.success{

display:none;

background:white;

padding:30px;

border-radius:12px;

text-align:center;

}



</style>


</head>


<body>


<header>

<h1>🛍️ SR Shopping BD</h1>

<p>অর্ডার করুন</p>

</header>



<div class="container">


<a href="index.html" class="back-button">

← পণ্যের তালিকায় ফিরে যান

</a>



<div id="orderSection">


<div class="card">



<div class="product-photo-box">


<img

id="productImage"

class="product-photo"

style="display:none;"

>


<div id="noImage" class="no-image">

Product Image

</div>


</div>




<div class="product-box">


<h2 id="productName">

Product Name

</h2>


<div class="product-price">

৳<span id="productPrice">0</span>

</div>


</div>



<form id="orderForm">
  <!-- QUANTITY -->

<label>
পরিমাণ *
</label>

<input

type="number"

id="quantity"

value="1"

min="1"

required

>




<!-- CUSTOMER NAME -->

<label>
আপনার নাম *
</label>


<input

type="text"

id="customerName"

placeholder="আপনার নাম লিখুন"

required

>





<!-- PHONE -->

<label>
মোবাইল নম্বর *
</label>


<input

type="tel"

id="phone"

placeholder="01XXXXXXXXX"

inputmode="numeric"

required

>






<!-- DELIVERY AREA -->

<label>
ডেলিভারি এলাকা *
</label>


<select

id="deliveryArea"

required

>


<option value="ঢাকার ভিতরে">

ঢাকার ভিতরে

</option>


<option value="ঢাকার বাইরে">

ঢাকার বাইরে

</option>


</select>







<!-- ADDRESS -->

<label>
সম্পূর্ণ ঠিকানা *
</label>


<textarea

id="address"

placeholder="বাসা, রোড, এলাকা, থানা/উপজেলা লিখুন"

required

></textarea>






<!-- PRODUCT CODE -->

<label>

Product Code (ঐচ্ছিক)

</label>


<input

type="text"

id="productCode"

placeholder="প্রোডাক্ট কোড থাকলে লিখুন"

>







<!-- PAYMENT SECTION -->


<div class="payment-box">


<label>

পেমেন্ট পদ্ধতি *

</label>




<div class="payment-option">


<input

type="radio"

id="cod"

name="payment"

value="Cash on Delivery"

checked

>


<label for="cod">

Cash on Delivery

</label>


</div>







<div class="payment-option">


<input

type="radio"

id="bkash"

name="payment"

value="bKash Send Money"

>


<label for="bkash">

bKash Send Money

</label>


</div>







<!-- BKASH DETAILS -->


<div id="bkashBox" class="bkash-box">


<p>

bKash Send Money

</p>



<p>

bKash Number:

</p>



<div class="bkash-number">

+8801774891525

</div>





<label>

bKash Transaction ID *

</label>



<input

type="text"

id="transactionId"

placeholder="Transaction ID লিখুন"

>



</div>



</div>







<!-- EXTRA REMARK -->

<label>

অতিরিক্ত তথ্য (ঐচ্ছিক)

</label>



<textarea

id="remarks"

placeholder="প্রয়োজন হলে অতিরিক্ত তথ্য লিখুন"

></textarea>







<!-- PRICE SUMMARY -->


<div class="summary">



<div class="summary-row">


<span>

পণ্যের মূল্য

</span>



<span>

৳<span id="productTotal">

0

</span>

</span>



</div>






<div class="summary-row">


<span>

ডেলিভারি চার্জ

</span>



<span>

৳<span id="deliveryCharge">

60

</span>

</span>



</div>







<div class="summary-row summary-total">


<span>

সর্বমোট

</span>



<span>

৳<span id="totalPrice">

0

</span>

</span>



</div>



</div>







<button

type="submit"

id="confirmButton"

class="confirm-button"

>

🛒 অর্ডার কনফার্ম করুন

</button>





<div

id="formError"

class="error">

</div>



</form>



</div>


</div>








<!-- SUCCESS MESSAGE -->


<div id="success" class="success">


<h2>

✅ অর্ডার সফল হয়েছে!

</h2>



<p>

আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।

</p>



<p>

আমরা খুব শীঘ্রই আপনার সাথে যোগাযোগ করব।

</p>



<button

class="confirm-button"

onclick="window.location.href='index.html'"

>

আরও পণ্য দেখুন

</button>



</div>
  
<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";


let dhakaDelivery = 60;

let outsideDelivery = 120;


let productName = "";

let productPrice = 0;

let productImage = "";




// ==========================================
// GET DATA FROM URL
// ==========================================

const urlParams =
new URLSearchParams(
window.location.search
);



productName =
urlParams.get("product") || "";



productPrice =
Number(
urlParams.get("price")
) || 0;



productImage =
urlParams.get("image") || "";





// ==========================================
// GOOGLE DRIVE IMAGE FIX
// ==========================================

function convertImageURL(url){


if(!url){

return "";

}



url =
String(url).trim();



let id = "";



let match =
url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id = match[1];

}




if(!id){


match =
url.match(/[?&]id=([^&]+)/);


if(match && match[1]){

id = match[1];

}


}




if(id){


return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}



return url;


}







// ==========================================
// SHOW PRODUCT
// ==========================================

function showProduct(){


document.getElementById("productName")
.textContent =
productName;



document.getElementById("productPrice")
.textContent =
productPrice.toLocaleString("en-BD");





if(productImage){


let img =
document.getElementById("productImage");



img.src =
convertImageURL(productImage);



img.style.display =
"block";



document.getElementById("noImage")
.style.display =
"none";


}



updateTotal();


}







// ==========================================
// LOAD DELIVERY SETTINGS
// ==========================================

function loadSettings(){


let callbackName =
"settings_" + Date.now();



window[callbackName] =
function(result){



delete window[callbackName];



if(
result &&
result.success &&
result.settings
){


dhakaDelivery =
Number(
result.settings.dhaka
) || 60;



outsideDelivery =
Number(
result.settings.outsideDhaka
) || 120;


}



updateTotal();



};





let script =
document.createElement("script");



script.src =

API_URL

+

"?action=settings"

+

"&callback="

+

callbackName;



document.body.appendChild(script);



}








// ==========================================
// PRICE CALCULATION
// ==========================================

function updateTotal(){


let qty =

Number(
document.getElementById("quantity").value
)

|| 1;



let productTotal =

productPrice * qty;




let area =

document.getElementById("deliveryArea").value;




let delivery =

area === "ঢাকার বাইরে"

?

outsideDelivery

:

dhakaDelivery;





document.getElementById("productTotal")
.textContent =

productTotal.toLocaleString("en-BD");



document.getElementById("deliveryCharge")
.textContent =

delivery.toLocaleString("en-BD");



document.getElementById("totalPrice")
.textContent =

(productTotal + delivery)
.toLocaleString("en-BD");



}







// ==========================================
// PAYMENT SHOW HIDE
// ==========================================


document
.getElementById("bkash")
.addEventListener(
"change",
function(){


document.getElementById("bkashBox")
.style.display =
"block";


});





document
.getElementById("cod")
.addEventListener(
"change",
function(){


document.getElementById("bkashBox")
.style.display =
"none";


});








// ==========================================
// INPUT UPDATE
// ==========================================


document
.getElementById("quantity")
.addEventListener(
"input",
updateTotal
);



document
.getElementById("deliveryArea")
.addEventListener(
"change",
updateTotal
);








// ==========================================
// SUBMIT ORDER
// ==========================================

document
.getElementById("orderForm")
.addEventListener(
"submit",
function(e){


e.preventDefault();




let paymentMethod =

document.querySelector(
'input[name="payment"]:checked'
).value;






let transactionId =

document.getElementById(
"transactionId"
).value.trim();







if(
paymentMethod === "bKash Send Money"

&&

!transactionId

){


document.getElementById("formError")
.textContent =
"bKash Transaction ID লিখুন।";


return;


}






let finalRemarks =

document.getElementById("remarks")
.value.trim();





let code =

document.getElementById("productCode")
.value.trim();







if(code){


finalRemarks +=

"\nProduct Code: "

+

code;


}





finalRemarks +=

"\nPayment Method: "

+

paymentMethod;







if(transactionId){


finalRemarks +=

"\nTransaction ID: "

+

transactionId;


}






submitOrder({

customerName:

document.getElementById("customerName")
.value.trim(),



phone:

document.getElementById("phone")
.value.trim(),



address:

document.getElementById("address")
.value.trim(),



productName:

productName,



quantity:

Number(
document.getElementById("quantity").value
)

||1,



deliveryArea:

document.getElementById("deliveryArea")
.value,



remarks:

finalRemarks


});



}

);








// ==========================================
// SEND ORDER TO GOOGLE SHEET
// ==========================================

function submitOrder(order){



let callbackName =

"order_" + Date.now();





window[callbackName] = function(result){



delete window[callbackName];



if(
result &&
result.success
){


document.getElementById("orderSection")
.style.display =
"none";



document.getElementById("success")
.style.display =
"block";



}

else{


document.getElementById("formError")
.textContent =
"অর্ডার পাঠানো যায়নি।";


}



};







let params =
new URLSearchParams();




params.append(
"action",
"saveOrder"
);



params.append(
"callback",
callbackName
);





Object.keys(order)
.forEach(function(key){


params.append(
key,
order[key]
);


});






let script =
document.createElement("script");



script.src =

API_URL

+

"?"

+

params.toString();





document.body.appendChild(script);



}






// ==========================================
// START
// ==========================================


showProduct();

loadSettings();



</script>


</body>

  </html>
