<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>অর্ডার করুন - SR Shopping BD</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:20px 15px;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.back-button{
  display:inline-block;
  margin-bottom:15px;
  text-decoration:none;
  color:#111;
  font-weight:bold;
}

/* =========================
   PRODUCT IMAGE
========================= */

.product-photo-box{
  background:#fff;
  border-radius:12px;
  padding:10px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  text-align:center;
}

.product-photo{
  width:100%;
  height:auto;
  max-height:500px;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:8px;
  cursor:zoom-in;
  background:#fff;
}

/* =========================
   IMAGE ZOOM
========================= */

.image-modal{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.92);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.image-modal img{
  max-width:100%;
  max-height:95vh;
  object-fit:contain;
}

.close-image{
  position:absolute;
  top:10px;
  right:18px;
  color:#fff;
  font-size:40px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   CARD
========================= */

.card{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.product-box{
  background:#f3f3f3;
  border-radius:10px;
  padding:16px;
  margin-bottom:20px;
}

.product-box h2{
  margin:0 0 8px;
  font-size:21px;
  line-height:1.4;
}

.product-price{
  font-size:23px;
  font-weight:bold;
}

/* =========================
   FORM
========================= */

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#111;
}

textarea{
  min-height:90px;
  resize:vertical;
}

/* =========================
   SUMMARY
========================= */

.summary{
  background:#f7f7f7;
  padding:15px;
  border-radius:10px;
  margin-top:20px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
}

.summary-total{
  border-top:1px solid #ccc;
  margin-top:8px;
  padding-top:12px;
  font-size:21px;
  font-weight:bold;
}

/* =========================
   BUTTON
========================= */

.confirm-button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:16px;
  margin-top:20px;
  background:#111;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.confirm-button:disabled{
  opacity:.6;
}

/* =========================
   LOADING / ERROR
========================= */

.loading{
  text-align:center;
  padding:40px 15px;
  font-size:17px;
}

.error{
  color:#c62828;
  margin-top:12px;
  text-align:center;
  line-height:1.6;
}

.success{
  display:none;
  background:#fff;
  border-radius:12px;
  padding:30px 20px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.success h2{
  margin-top:0;
}

.success-button{
  width:100%;
  border:0;
  border-radius:8px;
  padding:14px;
  margin-top:20px;
  background:#111;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .container{
    padding:12px 10px;
  }

  header h1{
    font-size:24px;
  }

  .card{
    padding:15px;
  }

  .product-photo{
    max-height:430px;
  }

  .product-box h2{
    font-size:19px;
  }

  .product-price{
    font-size:21px;
  }

  .confirm-button{
    font-size:16px;
  }

}

</style>
</head>

<body>

<header>
  <h1>SR Shopping BD</h1>
  <p>অর্ডার করুন</p>
</header>

<div class="container">

<a href="index.html" class="back-button">
  ← পণ্যের তালিকায় ফিরে যান
</a>

<!-- =========================
     LOADING
========================= -->

<div id="loading" class="loading">
  পণ্যের তথ্য লোড হচ্ছে...
</div>

<!-- =========================
     ERROR
========================= -->

<div id="error"
     class="error"
     style="display:none;">
</div>

<!-- =========================
     ORDER SECTION
========================= -->

<div id="orderSection" style="display:none;">

  <!-- PRODUCT IMAGE -->

  <div class="product-photo-box">

    <img
      id="productImage"
      class="product-photo"
      src=""
      alt="Product Image"
      onclick="openImage()"
    >

  </div>

  <div class="card">

    <div class="product-box">

      <h2 id="productName">
        পণ্য
      </h2>

      <div class="product-price">
        ৳<span id="productPrice">0</span>
      </div>

    </div>

    <form id="orderForm">

      <label>
        পরিমাণ *
      </label>

      <input
        type="number"
        id="quantity"
        value="1"
        min="1"
        required
      >

      <label>
        আপনার নাম *
      </label>

      <input
        type="text"
        id="customerName"
        placeholder="আপনার নাম লিখুন"
        required
      >

      <label>
        মোবাইল নম্বর *
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="01XXXXXXXXX"
        inputmode="numeric"
        required
      >

      <label>
        ডেলিভারি এলাকা *
      </label>

      <select
        id="deliveryArea"
        required
      >

        <option value="ঢাকার ভিতরে">
          ঢাকার ভিতরে
        </option>

        <option value="ঢাকার বাইরে">
          ঢাকার বাইরে
        </option>

      </select>

      <label>
        সম্পূর্ণ ঠিকানা *
      </label>

      <textarea
        id="address"
        placeholder="বাসা, রোড, এলাকা, থানা/উপজেলা লিখুন"
        required
      ></textarea>

      <label>
        অতিরিক্ত তথ্য (ঐচ্ছিক)
      </label>

      <textarea
        id="remarks"
        placeholder="প্রয়োজন হলে অতিরিক্ত তথ্য লিখুন"
      ></textarea>

      <!-- SUMMARY -->

      <div class="summary">

        <div class="summary-row">

          <span>
            পণ্যের মূল্য
          </span>

          <span>
            ৳<span id="productTotal">0</span>
          </span>

        </div>

        <div class="summary-row">

          <span>
            ডেলিভারি চার্জ
          </span>

          <span>
            ৳<span id="deliveryCharge">60</span>
          </span>

        </div>

        <div class="summary-row summary-total">

          <span>
            সর্বমোট
          </span>

          <span>
            ৳<span id="totalPrice">0</span>
          </span>

        </div>

      </div>

      <button
        type="submit"
        id="confirmButton"
        class="confirm-button">

        🛒 অর্ডার কনফার্ম করুন

      </button>

      <div
        id="formError"
        class="error">
      </div>

    </form>

  </div>

</div>

<!-- =========================
     SUCCESS
========================= -->

<div id="success" class="success">

  <h2>
    ✅ অর্ডার সফল হয়েছে!
  </h2>

  <p>
    আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।
  </p>

  <p>
    আমরা খুব শীঘ্রই আপনার সাথে যোগাযোগ করব।
  </p>

  <button
    class="success-button"
    onclick="window.location.href='index.html'">

    আরও পণ্য দেখুন

  </button>

</div>

</div>

<!-- =========================
     IMAGE MODAL
========================= -->

<div
  id="imageModal"
  class="image-modal"
  onclick="closeImage()">

  <span
    class="close-image"
    onclick="closeImage()">
    ×
  </span>

  <img
    id="largeProductImage"
    src=""
    alt="Product">

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT URL
========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";


/* ==========================================
   VARIABLES
========================================== */

let selectedProduct = null;

let dhakaDelivery = 60;

let outsideDelivery = 120;


/* ==========================================
   PRODUCT FROM URL
========================================== */

const urlParams =
new URLSearchParams(
  window.location.search
);

const productNameFromURL =
urlParams.get("product");


/* ==========================================
   LOAD PRODUCT
========================================== */

function loadProduct(){

  if(!productNameFromURL){

    showError(
      "কোনো পণ্য নির্বাচন করা হয়নি। প্রথম পেজ থেকে ORDER NOW চাপুন।"
    );

    return;
  }


  const callbackName =
    "productCallback_" +
    Date.now();


  let finished = false;


  window[callbackName] =
  function(result){

    if(finished){
      return;
    }

    finished = true;


    try{

      delete window[callbackName];


      if(
        !result ||
        result.success !== true
      ){

        showError(
          result &&
          result.error
          ? result.error
          : "পণ্যের তথ্য পাওয়া যায়নি।"
        );

        return;
      }


      const products =
        result.products || [];


      for(
        let i = 0;
        i < products.length;
        i++
      ){

        if(
          String(products[i].name).trim() ===
          String(productNameFromURL).trim()
        ){

          selectedProduct =
            products[i];

          showProduct();

          loadSettings();

          return;
        }

      }


      showError(
        "এই পণ্যটি বর্তমানে পাওয়া যাচ্ছে না।"
      );

    }

    catch(error){

      showError(
        "পণ্যের তথ্য দেখাতে সমস্যা হয়েছে।"
      );

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=products" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&time=" +
    Date.now();


  script.onerror =
  function(){

    if(finished){
      return;
    }

    finished = true;

    delete window[callbackName];

    showError(
      "Google Sheet থেকে পণ্যের তথ্য পাওয়া যাচ্ছে না।"
    );

  };


  document.body.appendChild(script);


  /* 15 SECOND TIMEOUT */

  setTimeout(
    function(){

      if(!finished){

        finished = true;

        delete window[callbackName];

        showError(
          "পণ্যের তথ্য লোড হতে সময় বেশি লাগছে। ইন্টারনেট সংযোগ বা Google Apps Script পরীক্ষা করুন।"
        );

      }

    },
    15000
  );

}


/* ==========================================
   SHOW PRODUCT
========================================== */

function showProduct(){

  document
  .getElementById("loading")
  .style.display =
  "none";


  document
  .getElementById("orderSection")
  .style.display =
  "block";


  document
  .getElementById("productName")
  .textContent =
  selectedProduct.name;


  document
  .getElementById("productPrice")
  .textContent =
  Number(
    selectedProduct.price || 0
  ).toLocaleString("en-BD");


  /* PRODUCT IMAGE */

  const image =
    document.getElementById(
      "productImage"
    );


  if(selectedProduct.image1){

    const imageURL =
      convertImageURL(
        selectedProduct.image1
      );


    image.src =
      imageURL;


    image.onerror =
    function(){

      image.style.display =
      "none";

    };

  }

  else{

    image.style.display =
    "none";

  }


  updateTotal();

}


/* ==========================================
   GOOGLE DRIVE IMAGE
========================================== */

function convertImageURL(url){

  if(!url){
    return "";
  }


  url =
  String(url).trim();


  let match =
  url.match(
    /\/file\/d\/([^\/]+)/
  );


  if(
    match &&
    match[1]
  ){

    return (
      "https://drive.google.com/thumbnail?id=" +
      match[1] +
      "&sz=w2000"
    );

  }


  match =
  url.match(
    /\/d\/([^\/]+)/
  );


  if(
    match &&
    match[1]
  ){

    return (
      "https://drive.google.com/thumbnail?id=" +
      match[1] +
      "&sz=w2000"
    );

  }


  match =
  url.match(
    /[?&]id=([^&]+)/
  );


  if(
    url.indexOf(
      "drive.google.com"
    ) !== -1 &&
    match &&
    match[1]
  ){

    return (
      "https://drive.google.com/thumbnail?id=" +
      match[1] +
      "&sz=w2000"
    );

  }


  return url;

}


/* ==========================================
   LOAD DELIVERY SETTINGS
========================================== */

function loadSettings(){

  const callbackName =
    "settingsCallback_" +
    Date.now();


  window[callbackName] =
  function(result){

    try{

      delete window[callbackName];


      if(
        result &&
        result.success === true &&
        result.settings
      ){

        dhakaDelivery =
        Number(
          result.settings.dhaka
        ) || 60;


        outsideDelivery =
        Number(
          result.settings.outsideDhaka
        ) || 120;

      }


      updateTotal();

    }

    catch(error){

      updateTotal();

    }

  };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?action=settings" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&time=" +
    Date.now();


  script.onerror =
  function(){

    delete window[callbackName];

    updateTotal();

  };


  document.body.appendChild(script);

}


/* ==========================================
   UPDATE TOTAL
========================================== */

function updateTotal(){

  if(!selectedProduct){
    return;
  }


  const quantity =
    Number(
      document
      .getElementById("quantity")
      .value
    ) || 1;


  const productPrice =
    Number(
      selectedProduct.price
    ) || 0;


  const productTotal =
    productPrice *
    quantity;


  const area =
    document
    .getElementById("deliveryArea")
    .value;


  let deliveryCharge;


  if(
    area === "ঢাকার বাইরে"
  ){

    deliveryCharge =
    outsideDelivery;

  }

  else{

    deliveryCharge =
    dhakaDelivery;

  }


  const total =
    productTotal +
    deliveryCharge;


  document
  .getElementById("productTotal")
  .textContent =
  productTotal.toLocaleString("en-BD");


  document
  .getElementById("deliveryCharge")
  .textContent =
  deliveryCharge.toLocaleString("en-BD");


  document
  .getElementById("totalPrice")
  .textContent =
  total.toLocaleString("en-BD");

}


/* ==========================================
   INPUT EVENTS
========================================== */

document
.getElementById("quantity")
.addEventListener(
  "input",
  updateTotal
);


document
.getElementById("deliveryArea")
.addEventListener(
  "change",
  updateTotal
);


/* ==========================================
   IMAGE ZOOM
========================================== */

function openImage(){

  const image =
    document.getElementById(
      "productImage"
    );


  if(!image.src){
    return;
  }


  document
  .getElementById(
    "largeProductImage"
  )
  .src =
  image.src;


  document
  .getElementById(
    "imageModal"
  )
  .style.display =
  "flex";

}


function closeImage(){

  document
  .getElementById(
    "imageModal"
  )
  .style.display =
  "none";

}


/* ==========================================
   FORM SUBMIT
========================================== */

document
.getElementById("orderForm")
.addEventListener(
"submit",
function(event){

  event.preventDefault();


  const customerName =
    document
    .getElementById("customerName")
    .value
    .trim();


  const phone =
    document
    .getElementById("phone")
    .value
    .trim();


  const address =
    document
    .getElementById("address")
    .value
    .trim();


  const quantity =
    Number(
      document
      .getElementById("quantity")
      .value
    ) || 1;


  const deliveryArea =
    document
    .getElementById("deliveryArea")
    .value;


  const remarks =
    document
    .getElementById("remarks")
    .value
    .trim();


  const formError =
    document
    .getElementById("formError");


  formError.textContent = "";


  if(!customerName){

    formError.textContent =
    "আপনার নাম লিখুন।";

    return;

  }


  if(!phone){

    formError.textContent =
    "মোবাইল নম্বর লিখুন।";

    return;

  }


  if(!address){

    formError.textContent =
    "সম্পূর্ণ ঠিকানা লিখুন।";

    return;

  }


  if(quantity < 1){

    formError.textContent =
    "পরিমাণ কমপক্ষে ১ হতে হবে।";

    return;

  }


  const button =
    document
    .getElementById(
      "confirmButton"
    );


  button.disabled =
  true;


  button.textContent =
  "অর্ডার পাঠানো হচ্ছে...";


  submitOrder({

    customerName:
      customerName,

    phone:
      phone,

    address:
      address,

    productName:
      selectedProduct.name,

    quantity:
      quantity,

    deliveryArea:
      deliveryArea,

    remarks:
      remarks

  });

});


/* ==========================================
   SUBMIT ORDER
========================================== */

function submitOrder(order){

  const callbackName =
    "orderCallback_" +
    Date.now();


  window[callbackName] =
  function(result){

    try{

      delete window[callbackName];


      const button =
        document
        .getElementById(
          "confirmButton"
        );


      if(
        result &&
        result.success === true
      ){

        document
        .getElementById(
          "orderSection"
        )
        .style.display =
        "none";


        document
        .getElementById(
          "success"
        )
        .style.display =
        "block";


        return;

      }


      button.disabled =
      false;


      button.textContent =
      "🛒 অর্ডার কনফার্ম করুন";


      document
      .getElementById(
        "formError"
      )
      .textContent =
      result &&
      (result.error || result.message)
      ?
      (
        result.error ||
        result.message
      )
      :
      "অর্ডার পাঠানো যায়নি।";

    }

    catch(error){

      showSubmitError();

    }

  };


  const params =
    new URLSearchParams();


  params.append(
    "action",
    "saveOrder"
  );


  params.append(
    "callback",
    callbackName
  );


  params.append(
    "customerName",
    order.customerName
  );


  params.append(
    "phone",
    order.phone
  );


  params.append(
    "address",
    order.address
  );


  params.append(
    "productName",
    order.productName
  );


  params.append(
    "quantity",
    order.quantity
  );


  params.append(
    "deliveryArea",
    order.deliveryArea
  );


  params.append(
    "remarks",
    order.remarks
  );


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?" +
    params.toString();


  script.onerror =
  function(){

    delete window[callbackName];

    showSubmitError();

  };


  document
  .body
  .appendChild(script);

}


/* ==========================================
   SUBMIT ERROR
========================================== */

function showSubmitError(){

  const button =
    document
    .getElementById(
      "confirmButton"
    );


  button.disabled =
  false;


  button.textContent =
  "🛒 অর্ডার কনফার্ম করুন";


  document
  .getElementById(
    "formError"
  )
  .textContent =
  "অর্ডার পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";

}


/* ==========================================
   GENERAL ERROR
========================================== */

function showError(message){

  document
  .getElementById(
    "loading"
  )
  .style.display =
  "none";


  document
  .getElementById(
    "orderSection"
  )
  .style.display =
  "none";


  const error =
    document
    .getElementById(
      "error"
    );


  error.style.display =
  "block";


  error.textContent =
  message;

}
