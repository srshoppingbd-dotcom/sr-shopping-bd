<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>অর্ডার করুন - SR Shopping BD</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}


header{

background:#111;

color:white;

text-align:center;

padding:15px;

}


header h1{

margin:0;

font-size:22px;

}


header p{

margin:5px 0 0;

font-size:13px;

}


.container{

max-width:600px;

margin:auto;

padding:10px;

}


.back-button{

display:block;

background:white;

padding:12px;

border-radius:12px;

text-decoration:none;

color:#111;

font-weight:bold;

margin-bottom:10px;

text-align:center;

}


.card{

background:white;

border-radius:15px;

padding:10px;

box-shadow:0 3px 12px rgba(0,0,0,.10);

}


/* IMAGE SLIDER */

.product-photo-box{

width:100%;

height:220px;

background:white;

border-radius:12px;

overflow:hidden;

position:relative;

border:1px solid #ddd;

}


.slider-track{

display:flex;

height:100%;

transition:.4s ease;

}


.slider-track img{

min-width:100%;

height:100%;

object-fit:contain;

}


.arrow{

position:absolute;

top:50%;

transform:translateY(-50%);

width:40px;

height:40px;

border-radius:50%;

background:#111;

color:white;

border:none;

font-size:25px;

}


.left{

left:10px;

}


.right{

right:10px;

}


.dots{

text-align:center;

padding:5px;

}


.dot{

display:inline-block;

width:10px;

height:10px;

background:#ccc;

border-radius:50%;

margin:3px;

}


.dot.active{

background:#d4af37;

}


.product-box{

background:#f5f5f5;

padding:12px;

border-radius:10px;

margin-top:10px;

}


.product-box h2{

margin:0 0 8px;

font-size:20px;

}


.product-price{

font-size:22px;

font-weight:bold;

}
  <style>

label{

display:block;

margin-top:12px;

margin-bottom:5px;

font-weight:bold;

}


input,
select,
textarea{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

}


textarea{

min-height:80px;

}


.payment-box{

background:#fafafa;

border:1px solid #ddd;

border-radius:10px;

padding:12px;

margin-top:15px;

}


.payment-option{

display:flex;

align-items:center;

gap:8px;

margin:10px 0;

}


.bkash-box{

display:none;

background:#fff0f5;

border:1px solid #e91e63;

border-radius:10px;

padding:12px;

margin-top:10px;

}


.bkash-number{

font-size:18px;

font-weight:bold;

color:#d81b60;

}


.summary{

background:#f7f7f7;

padding:12px;

border-radius:10px;

margin-top:15px;

}


.summary-row{

display:flex;

justify-content:space-between;

padding:6px 0;

}


.summary-total{

border-top:1px solid #ccc;

padding-top:10px;

font-size:20px;

font-weight:bold;

}


.confirm-button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:10px;

background:#111;

color:white;

font-size:17px;

font-weight:bold;

}


.error{

color:red;

text-align:center;

margin-top:10px;

}


.success{

display:none;

background:white;

padding:25px;

border-radius:12px;

text-align:center;

}


</style>

</head>


<body>


<header>

<h1>🛍️ SR Shopping BD</h1>

<p>অর্ডার করুন</p>

</header>



<div class="container">


<a href="index.html" class="back-button">

← পণ্যের তালিকায় ফিরে যান

</a>


<div id="orderSection">


<div class="card">


<div class="product-photo-box">


<div id="sliderTrack" class="slider-track"></div>


<button class="arrow left" onclick="previousImage()">

‹

</button>


<button class="arrow right" onclick="nextImage()">

›

</button>


</div>


<div id="dots" class="dots"></div>



<div class="product-box">


<h2 id="productName">

Product Name

</h2>


<div class="product-price">

৳<span id="productPrice">0</span>

</div>


</div>



<form id="orderForm">


<label>

পরিমাণ *

</label>


<input type="number" id="quantity" value="1" min="1">



<label>

আপনার নাম *

</label>


<input type="text" id="customerName" required>



<label>

মোবাইল নম্বর *

</label>


<input type="tel" id="phone" required>



<label>

ডেলিভারি এলাকা *

</label>


<select id="deliveryArea">

<option value="ঢাকার ভিতরে">

ঢাকার ভিতরে

</option>


<option value="ঢাকার বাইরে">

ঢাকার বাইরে

</option>


</select>



<label>

সম্পূর্ণ ঠিকানা *

</label>


<textarea id="address" required></textarea>



<label>

Product Code

</label>


<input type="text" id="productCode">



<div class="payment-box">


<label>

পেমেন্ট পদ্ধতি *

</label>



<div class="payment-option">

<input type="radio" id="cod" name="payment" value="Cash on Delivery" checked>

<label for="cod">

Cash on Delivery

</label>

</div>


<div class="payment-option">

<input type="radio" id="bkash" name="payment" value="bKash Send Money">

<label for="bkash">

bKash Send Money

</label>

</div>


<div id="bkashBox" class="bkash-box">

<p><b>bKash Number</b></p>

<div class="bkash-number">

+8801774891525

</div>


<label>

Transaction ID

</label>


<input id="transactionId">

</div>


</div>


<label>

অতিরিক্ত তথ্য

</label>


<textarea id="remarks"></textarea>

<div class="summary">


<div class="summary-row">

<span>পণ্যের মূল্য</span>

<span>
৳<span id="productTotal">0</span>
</span>

</div>



<div class="summary-row">

<span>ডেলিভারি চার্জ</span>

<span>
৳<span id="deliveryCharge">60</span>
</span>

</div>



<div class="summary-row summary-total">

<span>সর্বমোট</span>

<span>
৳<span id="totalPrice">0</span>
</span>

</div>


</div>



<button type="submit" class="confirm-button">

🛒 অর্ডার কনফার্ম করুন

</button>


<div id="formError" class="error"></div>


</form>


</div>


</div>



<div id="success" class="success">

<h2>✅ অর্ডার সফল হয়েছে!</h2>

<p>আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।</p>


<button class="confirm-button" onclick="window.location.href='index.html'">

আরও পণ্য দেখুন

</button>


</div>



<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productName="";
let productPrice=0;
let images=[];
let currentImage=0;

let dhakaDelivery=60;
let outsideDelivery=120;



const urlParams=new URLSearchParams(window.location.search);



productName=urlParams.get("product") || "";

productPrice=Number(urlParams.get("price")) || 0;



let imageParam=urlParams.get("image") || "";


if(imageParam){

images.push(
decodeURIComponent(imageParam)
);

}


document.getElementById("productName").innerHTML=productName;


document.getElementById("productPrice").innerHTML=

productPrice.toLocaleString("en-BD");





function createSlider(){

let track=document.getElementById("sliderTrack");

let dots=document.getElementById("dots");


track.innerHTML="";

dots.innerHTML="";


images.forEach(function(url,index){


let img=document.createElement("img");

img.src=url;

img.style.width="100%";

img.style.flexShrink="0";

img.style.objectFit="contain";


track.appendChild(img);



let dot=document.createElement("span");

dot.className="dot";


if(index===0){

dot.classList.add("active");

}


dots.appendChild(dot);


});


  }




function updateSlider(){


document.getElementById("sliderTrack").style.transform=

"translateX(-"+

(currentImage*100)

+"%)";


}




function nextImage(){


if(currentImage < images.length-1){

currentImage++;

}


updateSlider();

}



function previousImage(){


if(currentImage>0){

currentImage--;

}


updateSlider();

}





function updateTotal(){


let qty=

Number(document.getElementById("quantity").value)||1;


let total=

productPrice*qty;



let delivery=

document.getElementById("deliveryArea").value==="ঢাকার বাইরে"

?

outsideDelivery

:

dhakaDelivery;



document.getElementById("productTotal").innerHTML=

total.toLocaleString("en-BD");



document.getElementById("deliveryCharge").innerHTML=

delivery;



document.getElementById("totalPrice").innerHTML=

(total+delivery).toLocaleString("en-BD");


}





document.getElementById("quantity")

.addEventListener("input",updateTotal);



document.getElementById("deliveryArea")

.addEventListener("change",updateTotal);





document.getElementById("bkash")

.addEventListener("change",function(){

document.getElementById("bkashBox").style.display="block";

});



document.getElementById("cod")

.addEventListener("change",function(){

document.getElementById("bkashBox").style.display="none";

});






document.getElementById("orderForm")

.addEventListener("submit",function(e){


e.preventDefault();


let callbackName="order_"+Date.now();



window[callbackName]=function(result){


if(result && result.success){


document.getElementById("orderSection").style.display="none";


document.getElementById("success").style.display="block";


}

};




let params=new URLSearchParams();


params.append("action","saveOrder");

params.append("callback",callbackName);


params.append("customerName",

document.getElementById("customerName").value);



params.append("phone",

document.getElementById("phone").value);



params.append("address",

document.getElementById("address").value);



params.append("productName",productName);


params.append("quantity",

document.getElementById("quantity").value);



params.append("deliveryArea",

document.getElementById("deliveryArea").value);



params.append("remarks",

document.getElementById("remarks").value);



params.append("productCode",

document.getElementById("productCode").value);



params.append("paymentMethod",

document.querySelector('input[name="payment"]:checked').value);



params.append("transactionId",

document.getElementById("transactionId").value);



let script=document.createElement("script");


script.src=API_URL+"?"+params.toString();


document.body.appendChild(script);



});



createSlider();

updateTotal();


</script>


</body>

</html>
