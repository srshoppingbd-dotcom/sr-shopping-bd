<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SR Shopping BD Admin</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;

}



.header{

background:#111;
color:white;
padding:20px;
text-align:center;

}



.container{

max-width:1100px;
margin:auto;
padding:15px;

}



.card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 3px 10px #ddd;

}



input,select,button{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
font-size:16px;

}



input,select{

border:1px solid #ccc;

}



button{

background:#111;
color:white;
border:none;
font-weight:bold;

}



.logout{

background:#d00000;

}



.hidden{

display:none;

}



table{

width:100%;
border-collapse:collapse;

}



th,td{

border:1px solid #ddd;
padding:8px;
font-size:14px;

}



th{

background:#111;
color:white;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;

}



.box{

background:#eee;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:bold;

}



.msg{

margin-top:10px;
font-weight:bold;

}


</style>

</head>



<body>


<div class="header">

<h1>🛍️ SR Shopping BD</h1>

<p>Admin Panel</p>

</div>



<div class="container">


<!-- LOGIN -->


<div id="loginBox" class="card">


<h2>Admin Login</h2>

<label>Staff ID</label>

<input 
id="staffId"
placeholder="Enter Staff ID">



<input id="password"
type="password"
placeholder="Password">



<button onclick="login()">

Login

</button>


<p id="loginMessage" class="msg"></p>



<button onclick="showForgot()">

Forgot Password

</button>



</div>






<!-- DASHBOARD -->


<div id="dashboard" class="hidden">



<div class="card">


<h2 id="welcome"></h2>


<button class="logout" onclick="logout()">

Logout

</button>



<button onclick="showChangePassword()">

Change Password

</button>



<button onclick="showCreateUser()">

Create User

</button>



<button onclick="showResetPassword()">

Reset User Password

</button>


</div>
id="admin_part2"


<!-- CHANGE PASSWORD -->

<div id="changeBox" class="card hidden">


<h3>Change Password</h3>


<input id="oldPassword"
type="password"
placeholder="Old Password">


<input id="newPassword"
type="password"
placeholder="New Password">


<input id="confirmPassword"
type="password"
placeholder="Confirm Password">


<button onclick="changePassword()">

Save Password

</button>


<p id="changeMessage" class="msg"></p>


</div>






<!-- CREATE USER -->


<div id="createBox" class="card hidden">


<h3>Create Manager / Delivery</h3>



<input id="userName"
placeholder="Name">


<p>
Staff ID will be generated automatically
</p>

<input id="userPassword"
type="password"
placeholder="Password">


<input id="userMobile"
placeholder="Mobile Number">



<select id="userRole">


<option value="manager">
👨‍💼 Manager
</option>


<option value="delivery">
🚚 Delivery
</option>


</select>



<button onclick="createUser()">

Create User

</button>


<p id="createMessage" class="msg"></p>


</div>







<!-- RESET PASSWORD -->


<div id="resetBox" class="card hidden">


<h3>Reset User Password</h3>



<select id="resetUser">

<option value="">
Select User
</option>


</select>



<button onclick="resetPassword()">

Reset

</button>


<p id="resetMessage" class="msg"></p>


</div>







<!-- SEARCH -->


<div class="card">


<h3>Search Customer Order</h3>



<input id="searchInput"
placeholder="Phone / Order ID">


<button onclick="searchOrder()">

Search

</button>


</div>







<!-- SUMMARY -->


<div class="card">


<h3>Dashboard</h3>


<div class="grid">


<div class="box">

Total Orders

<br>

<span id="totalOrders">
0
</span>

</div>



<div class="box">

Pending

<br>

<span id="pendingOrders">
0
</span>


</div>


</div>


</div>








<!-- ORDER TABLE -->


<div class="card">


<h3>Orders</h3>



<div style="overflow:auto;">


<table>


<thead>

<tr>

<th>ID</th>

<th>Customer</th>

<th>Phone</th>

<th>Product</th>

<th>Amount</th>

<th>Status</th>

<th>Action</th>


</tr>

</thead>


<tbody id="orderTable">

</tbody>


</table>


</div>


</div>



</div>


<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let currentUser=null;




function login(){


let staffId=document.getElementById("staffId").value;

let password=document.getElementById("password").value;



document.getElementById("loginMessage").innerHTML=
"⏳ Logging in...";



let callback="login_"+Date.now();



window[callback]=function(result){


delete window[callback];



if(result.success){


currentUser=result.user;



document.getElementById("loginBox").style.display="none";

document.getElementById("dashboard").classList.remove("hidden");


document.getElementById("welcome").innerHTML=

"Welcome "+currentUser.name+
" ("+
currentUser.role+
")";



loadOrders();

loadUsers();


}


else{


document.getElementById("loginMessage").innerHTML=
"❌ "+result.message;


}



};



let script=document.createElement("script");


script.src=

API_URL+

"?action=adminLogin"+

"&staffId="+encodeURIComponent(staffId)+

"&password="+encodeURIComponent(password)+

"&callback="+callback;



document.body.appendChild(script);



}



function loadOrders(){


let callback="orders_"+Date.now();



window[callback]=function(result){


delete window[callback];


if(result.success){


let orders=result.orders;



document.getElementById("totalOrders").innerHTML=
orders.length;



let pending=0;

let html="";



orders.forEach(function(o){



if(o["Order Status"]==="Pending"){

pending++;

}



html+=`

<tr>

<td>${o["Order ID"]||""}</td>

<td>${o["Customer Name"]||""}</td>

<td>${o["Phone"]||""}</td>

<td>${o["Product Name"]||""}</td>

<td>${o["Total Price"]||""}</td>

<td>${o["Order Status"]||""}</td>

<td>

${
currentUser.role==="owner"

?

`<button onclick="deleteOrder('${o["Order ID"]}')">
Delete
</button>`

:

""

}

</td>


</tr>

`;



});



document.getElementById("pendingOrders").innerHTML=
pending;


document.getElementById("orderTable").innerHTML=
html;



}


};



let script=document.createElement("script");


script.src=

API_URL+

"?action=adminOrders"+

"&role="+currentUser.role+

"&callback="+callback;



document.body.appendChild(script);


}







function loadUsers(){


let callback="users_"+Date.now();



window[callback]=function(result){


delete window[callback];


if(result.success){


let box=document.getElementById("resetUser");


box.innerHTML=
"<option value=''>Select User</option>";



result.users.forEach(function(u){


box.innerHTML+=

`
<option value="${u.username}">
${u.name} (${u.role})
</option>
`;


});


}



};



let script=document.createElement("script");


script.src=

API_URL+

"?action=getUsers"+

"&callback="+callback;



document.body.appendChild(script);


}







function showChangePassword(){

document.getElementById("changeBox")
.classList.remove("hidden");

}



function showCreateUser(){

document.getElementById("createBox")
.classList.remove("hidden");

}



function showResetPassword(){

document.getElementById("resetBox")
.classList.remove("hidden");

}







function changePassword(){


let oldPass=document.getElementById("oldPassword").value;

let newPass=document.getElementById("newPassword").value;


let confirm=document.getElementById("confirmPassword").value;



if(newPass!==confirm){


document.getElementById("changeMessage").innerHTML=
"❌ Password not match";

return;

}



let callback="change_"+Date.now();



window[callback]=function(result){


delete window[callback];


document.getElementById("changeMessage").innerHTML=

result.success

?

"✅ Password Changed"

:

"❌ "+result.message;


};



let script=document.createElement("script");


script.src=

API_URL+

"?action=changePassword"+

"&username="+currentUser.username+

"&oldPassword="+encodeURIComponent(oldPass)+

"&newPassword="+encodeURIComponent(newPass)+

"&callback="+callback;



document.body.appendChild(script);


}







function createUser(){


let name=document.getElementById("userName").value;


let password=document.getElementById("userPassword").value;

let role=document.getElementById("userRole").value;

let mobile=document.getElementById("userMobile").value;



let callback="create_"+Date.now();



window[callback]=function(result){


delete window[callback];


document.getElementById("createMessage").innerHTML=

result.success

?

"✅ User Created<br>Staff ID: "+result.staffId
:

"❌ "+result.message;


loadUsers();


};



let script=document.createElement("script");


script.src=

API_URL+

"?action=createUser"+

"&name="+encodeURIComponent(name)+

"&password="+encodeURIComponent(password)+

"&role="+role+

"&mobile="+mobile+

"&callback="+callback;



document.body.appendChild(script);



}







function resetPassword(){


let username=document.getElementById("resetUser").value;



let callback="reset_"+Date.now();



window[callback]=function(result){


delete window[callback];


document.getElementById("resetMessage").innerHTML=

result.success

?

"✅ New Password: 12345678"

:

"❌ "+result.message;


};



let script=document.createElement("script");


script.src=

API_URL+

"?action=forgotPassword"+

"&username="+username+

"&callback="+callback;



document.body.appendChild(script);


}







function searchOrder(){


let phone=document.getElementById("searchInput").value;



let callback="search_"+Date.now();



window[callback]=function(result){


delete window[callback];



let html="";



result.orders.forEach(function(o){


html+=`

<tr>

<td>${o["Order ID"]||""}</td>

<td>${o["Customer Name"]||""}</td>

<td>${o["Phone"]||""}</td>

<td>${o["Product Name"]||""}</td>

<td>${o["Total Price"]||""}</td>

<td>${o["Order Status"]||""}</td>

<td></td>

</tr>

`;


});



document.getElementById("orderTable").innerHTML=html;



};



let script=document.createElement("script");


script.src=

API_URL+

"?action=searchCustomer"+

"&phone="+phone+

"&callback="+callback;



document.body.appendChild(script);



}







function deleteOrder(id){


if(!confirm("Delete this order?")){

return;

}



let callback="delete_"+Date.now();



window[callback]=function(result){


delete window[callback];


alert(result.message);


loadOrders();


};



let script=document.createElement("script");


script.src=

API_URL+

"?action=deleteOrder"+

"&orderId="+id+

"&callback="+callback;



document.body.appendChild(script);


}






function logout(){

location.reload();

}



</script>


</body>

</html>
