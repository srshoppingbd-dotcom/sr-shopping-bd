<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product - SR Shopping BD</title>


<style>

*{
box-sizing:border-box;
}


body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}


header{

background:#111;
color:white;
text-align:center;
padding:20px;

}


header h1{

margin:0;
font-size:27px;

}


.container{

max-width:700px;
margin:auto;
padding:15px;

}


.back-button{

display:inline-block;
margin-bottom:15px;
text-decoration:none;
color:#111;
font-weight:bold;

}



.product-card{

background:#fff;
border-radius:15px;
padding:15px;
box-shadow:0 3px 12px rgba(0,0,0,.10);

}



.product-image-box{

width:100%;
height:420px;
background:#fff;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border:1px solid #eee;

}



.product-image{

width:100%;
height:100%;
object-fit:contain;

}



.no-image{

color:#999;

}



.product-name{

font-size:26px;
font-weight:bold;
margin-top:20px;

}



.product-description{

font-size:16px;
color:#666;
line-height:1.6;
margin:12px 0;

}



.product-price{

font-size:26px;
font-weight:bold;
margin:15px 0;

}



.order-button{

width:100%;
padding:15px;
background:#111;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;

}



.share-box{

display:flex;
gap:8px;
margin-top:12px;

}



.share-box button{

flex:1;
padding:10px;
border:none;
border-radius:8px;
color:white;
font-weight:bold;

}



.facebook{

background:#1877f2;

}


.whatsapp{

background:#25d366;

}


.copy{

background:#555;

}



.not-found{

text-align:center;
padding:40px;
color:red;

}



@media(max-width:600px){

.product-image-box{

height:330px;

}

}


</style>

</head>


<body>


<header>

<h1>🛍️ SR Shopping BD</h1>

<p>Product Details</p>

</header>



<div class="container">


<a href="index.html" class="back-button">

← সকল পণ্য দেখুন

</a>



<div id="loading"
style="text-align:center;padding:40px;">

পণ্য লোড হচ্ছে...

</div>



<div id="productArea"></div>
 
 <script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productData = null;





// ===============================
// GET PRODUCT NAME FROM LINK
// ===============================


const urlParams =

new URLSearchParams(
window.location.search
);



const selectedProduct =

urlParams.get("product") || "";








// ===============================
// LOAD PRODUCT
// ===============================


function loadProduct(){



if(!selectedProduct){


showNotFound();

return;

}




let callbackName =

"productCallback_" + Date.now();





window[callbackName] = function(result){



delete window[callbackName];





if(

result &&

result.success === true

){



let products =

result.products || [];





productData =

products.find(function(item){



return item.name === selectedProduct;



});







if(productData){


displayProduct();


}

else{


showNotFound();


}




}

else{


showNotFound();


}



};








let script =

document.createElement("script");




script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}









// ===============================
// GOOGLE DRIVE IMAGE FIX
// ===============================


function convertImageURL(url){



if(!url){

return "";

}





url =

String(url).trim();







if(

url.includes("thumbnail")

){


return url;


}






let id = "";






let match =

url.match(

/\/file\/d\/([^\/]+)/

);






if(match && match[1]){


id = match[1];


}






if(!id){



match =

url.match(

/[?&]id=([^&]+)/

);





if(match && match[1]){


id = match[1];


}


}







if(id){


return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}






return url;



}









// ===============================
// DISPLAY PRODUCT
// ===============================


function displayProduct(){



document

.getElementById("loading")

.style.display="none";







let imageURL =

convertImageURL(

productData.image1

);






document

.getElementById("productArea")

.innerHTML = `




<div class="product-card">






<div class="product-image-box">



${

imageURL

?

`

<img

class="product-image"

src="${imageURL}"

alt="${productData.name}"

>

`

:

`

<div class="no-image">

Image নেই

</div>

`

}





</div>









<div class="product-name">

${productData.name || ""}

</div>






<div class="product-description">

${productData.description || ""}

</div>






<div class="product-price">

৳${Number(productData.price || 0)

.toLocaleString("en-BD")}

</div>






<button

class="order-button"

onclick="orderNow()"

>

🛒 ORDER NOW

</button>






<div class="share-box">



<button

class="facebook"

onclick="shareFacebook()"

>

📘 Facebook

</button>





<button

class="whatsapp"

onclick="shareWhatsApp()"

>

🟢 WhatsApp

</button>





<button

class="copy"

onclick="copyLink()"

>

🔗 Copy

</button>



</div>





</div>



`;



}
  

// ===============================
// ORDER NOW
// ===============================


function orderNow(){



let image =

convertImageURL(

productData.image1

);





window.location.href =

"order.html?product="

+

encodeURIComponent(productData.name)

+

"&price="

+

encodeURIComponent(productData.price)

+

"&image="

+

encodeURIComponent(image);



}









// ===============================
// GET PRODUCT LINK
// ===============================


function getProductLink(){


return window.location.href;


}









// ===============================
// FACEBOOK SHARE
// ===============================


function shareFacebook(){



let link =

getProductLink();






window.open(


"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(link),


"_blank"


);



}









// ===============================
// WHATSAPP SHARE
// ===============================


function shareWhatsApp(){



let link =

getProductLink();






let message =


"🛍️ SR Shopping BD\n\n"

+

productData.name

+

"\n\nঅর্ডার করতে ভিজিট করুন:\n"

+

link;







window.open(


"https://wa.me/?text="

+

encodeURIComponent(message),


"_blank"


);



}









// ===============================
// COPY LINK
// ===============================


function copyLink(){



navigator.clipboard.writeText(

getProductLink()

);



alert(

"Product Link Copy হয়েছে"

);



}









// ===============================
// PRODUCT NOT FOUND
// ===============================


function showNotFound(){



document

.getElementById("loading")

.style.display="none";





document

.getElementById("productArea")

.innerHTML = `


<div class="not-found">

❌ Product পাওয়া যায়নি

</div>


`;



}









// ===============================
// START
// ===============================


loadProduct();



</script>


</div>


</body>


</html>
