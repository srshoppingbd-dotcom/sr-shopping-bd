 <script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let currentProduct = {};

let zoomLevel = 1;




// GET PRODUCT NAME


const params =

new URLSearchParams(
window.location.search
);



let selectedProduct =

params.get("product") || "";







// DRIVE IMAGE FIX


function convertImageURL(url){


if(!url){

return "";

}


url = String(url).trim();



let id="";



let match =

url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id = match[1];

}



if(!id){


match =

url.match(/[?&]id=([^&]+)/);



if(match && match[1]){

id=match[1];

}

}



if(id){


return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}



return url;


}








// LOAD PRODUCT


function loadProduct(){



let callbackName =

"product_" + Date.now();





window[callbackName] = function(result){



delete window[callbackName];




if(result && result.success){



let products =

result.products || [];





let product =

products.find(function(item){



return String(item.name).trim()

===

String(selectedProduct).trim();



});






if(product){


currentProduct = product;


showProduct(product);


}


}



};






let script =

document.createElement("script");



script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}









// SHOW PRODUCT


function showProduct(product){



document.getElementById("productName")
.innerHTML =

product.name || "";





document.getElementById("productDescription")
.innerHTML =

product.description || "";





document.getElementById("productPrice")
.innerHTML =

Number(product.price || 0)

.toLocaleString("en-BD");








let img =

document.getElementById("productImage");





if(product.image1){



img.src =

convertImageURL(product.image1);





img.onload=function(){



img.style.display="block";


document.getElementById("noImage")
.style.display="none";


};




}





// ORDER BUTTON


document

.getElementById("orderBtn")

.onclick=function(){



window.location.href =


"order.html?product="

+

encodeURIComponent(product.name)

+

"&price="

+

encodeURIComponent(product.price)

+

"&image="

+

encodeURIComponent(

convertImageURL(product.image1)

);



};




}









// ZOOM IN


function zoomIn(){



if(zoomLevel < 2.5){


zoomLevel +=0.2;


}



document.getElementById("productImage")
.style.transform =

"scale("+zoomLevel+")";


}








// ZOOM OUT


function zoomOut(){



if(zoomLevel > 1){


zoomLevel -=0.2;


}




document.getElementById("productImage")
.style.transform =

"scale("+zoomLevel+")";


}









// RESET


function resetZoom(){


zoomLevel = 1;



document.getElementById("productImage")
.style.transform =

"scale(1)";


}






loadProduct();
