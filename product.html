<style>


*{

box-sizing:border-box;

}



body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}




/* HEADER */

.header{

background:#111;

color:white;

text-align:center;

padding:22px 10px;

}



.header h1{

margin:0;

font-size:28px;

}



.header p{

margin:8px 0 0;

font-size:17px;

}





.container{

width:100%;

max-width:600px;

margin:auto;

padding:12px;

}






/* ALL PRODUCT BUTTON */


.all-products-btn{

display:flex;

align-items:center;

justify-content:space-between;

background:white;

border:2px solid #d4af37;

border-radius:18px;

padding:12px;

margin:12px 0 18px;

text-decoration:none;

color:#111;

box-shadow:0 4px 15px rgba(0,0,0,.15);

}




.btn-icon{

width:45px;

height:45px;

border-radius:50%;

background:#111;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

}



.btn-text{

flex:1;

text-align:center;

font-size:16px;

font-weight:bold;

line-height:1.4;

}



.btn-arrow{

width:45px;

height:45px;

border-radius:50%;

background:#d4af37;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:bold;

}







/* PRODUCT CARD */


.product-card{

background:white;

border-radius:18px;

padding:12px;

box-shadow:0 4px 15px rgba(0,0,0,.12);

}





/* IMAGE */


.image-box{

width:100%;

height:260px;

background:#fff;

border-radius:15px;

border:1px solid #eee;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

}



.image-box img{

width:100%;

height:100%;

object-fit:contain;

}



.no-image{

font-size:18px;

color:#999;

}





/* PRODUCT DETAILS */


.product-name{

font-size:25px;

font-weight:700;

margin-top:18px;

line-height:1.3;

}



.product-description{

font-size:16px;

color:#666;

line-height:1.7;

margin-top:10px;

}



.product-price{

font-size:30px;

font-weight:bold;

margin-top:12px;

}





/* ORDER BUTTON */


.order-btn{

width:100%;

padding:15px;

margin-top:18px;

background:#111;

color:white;

border:none;

border-radius:12px;

font-size:20px;

font-weight:bold;

}







/* SHARE */


.share-buttons{

display:flex;

gap:8px;

margin-top:12px;

}



.share-buttons button{

flex:1;

padding:12px 5px;

border:none;

border-radius:10px;

color:white;

}



.facebook{

background:#1877f2;

}



.whatsapp{

background:#25d366;

}

}



@media(max-width:600px){


.image-box{

height:250px;

}



.product-name{

}


}


</style>


</head>



<body>



<div class="header">


<h1>

🛍️ SR Shopping BD

</h1>


<p>

Product Details

</p>


</div>





<div class="container">



<a href="index.html" class="all-products-btn">


<div class="btn-icon">

🛍️

</div>


<div class="btn-text">

এই ওয়েবসাইটের আরও সকল পণ্য<br>

দেখার জন্য ক্লিক করুন

</div>


<div class="btn-arrow">

→

</div>


</a>





<div class="product-card">



<div class="image-box">


<img id="productImage" style="display:none;">


<div id="noImage" class="no-image">

Image নেই

</div>


</div>





<div id="productName" class="product-name">

লোড হচ্ছে...

</div>





<div id="productDescription" class="product-description">

</div>





<div class="product-price">

৳<span id="productPrice">0</span>

</div>





<button id="orderBtn" class="order-btn">

🛒 ORDER NOW

</button>





<div class="share-buttons">


<button class="facebook">

📘 Facebook

</button>


<button class="whatsapp">

🟢 WhatsApp

</button>


<button class="copy">

🔗 Copy

</button>


</div>



</div>
 <script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productData = {};





// ===============================
// GET PRODUCT NAME FROM LINK
// ===============================


const params =
new URLSearchParams(window.location.search);



let productNameURL =
params.get("product") || "";






// ===============================
// GOOGLE DRIVE IMAGE FIX
// ===============================


function convertImageURL(url){


if(!url){

return "";

}



url = String(url).trim();



let id = "";



// /file/d/id


let match =
url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id = match[1];

}




// open?id=id


if(!id){


match =
url.match(/[?&]id=([^&]+)/);


if(match && match[1]){

id = match[1];

}


}





if(id){


return "https://drive.google.com/thumbnail?id="
+
id
+
"&sz=w1200";


}




return url;


}









// ===============================
// LOAD PRODUCT
// ===============================


function loadProduct(){



let callbackName =
"productCallback_" + Date.now();





window[callbackName] = function(result){



delete window[callbackName];




if(
result &&
result.success
){



let products =
result.products || [];




let found =
products.find(function(item){



return String(item.name).trim()

===

String(productNameURL).trim();



});







if(found){



productData = found;



showProduct(found);



}

else{


document.getElementById("productName")
.innerHTML =
"Product পাওয়া যায়নি";


}



}



};







let script =
document.createElement("script");



script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}









// ===============================
// SHOW PRODUCT
// ===============================


function showProduct(product){



document.getElementById("productName")
.innerHTML =
product.name || "";





document.getElementById("productDescription")
.innerHTML =
product.description || "";





document.getElementById("productPrice")
.innerHTML =

Number(product.price || 0)

.toLocaleString("en-BD");








if(product.image1){



let img =
document.getElementById("productImage");




img.src =
convertImageURL(product.image1);




img.onload=function(){


img.style.display="block";


document.getElementById("noImage")
.style.display="none";


};




img.onerror=function(){


img.style.display="none";


document.getElementById("noImage")
.innerHTML =
"Image পাওয়া যায়নি";


};




}





// ORDER BUTTON


document.getElementById("orderBtn")
.onclick=function(){



window.location.href =

"order.html?product="

+

encodeURIComponent(product.name)

+

"&price="

+

encodeURIComponent(product.price)

+

"&image="

+

encodeURIComponent(
convertImageURL(product.image1)
);



};




}





// START


loadProduct();



 </script>
 <script>


// ===============================
// GET CURRENT PRODUCT LINK
// ===============================


function getProductLink(){

return window.location.href;

}





// ===============================
// FACEBOOK SHARE
// ===============================


document
.querySelector(".facebook")
.addEventListener(
"click",
function(){


let link =
getProductLink();



window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(link),


"_blank"

);


});








// ===============================
// WHATSAPP SHARE
// ===============================


document
.querySelector(".whatsapp")
.addEventListener(
"click",
function(){



let message =


"🛍️ SR Shopping BD\n\n"

+

(productData.name || "")

+

"\n\nঅর্ডার করতে ভিজিট করুন:\n"

+

getProductLink();





window.open(

"https://wa.me/?text="

+

encodeURIComponent(message),


"_blank"

);



});









// ===============================
// COPY LINK
// ===============================


document
.querySelector(".copy")
.addEventListener(
"click",
function(){



navigator.clipboard.writeText(

getProductLink()

);



alert(

"Product Link Copy হয়েছে"

);



});









// ===============================
// UPDATE FACEBOOK META
// ===============================


if(productData.name){



document.title =

productData.name
+
" | SR Shopping BD";





let ogTitle =
document.querySelector(
'meta[property="og:title"]'
);



let ogImage =
document.querySelector(
'meta[property="og:image"]'
);





if(ogTitle){

ogTitle.setAttribute(
"content",
productData.name
);

}




if(ogImage && productData.image1){


ogImage.setAttribute(

"content",

convertImageURL(productData.image1)

);


}



}





</script>



</div>


</body>
