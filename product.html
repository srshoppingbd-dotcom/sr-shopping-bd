<style>


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}



/* HEADER */


header{

background:#111;

color:white;

text-align:center;

padding:25px 15px;

}



header h1{

margin:0;

font-size:28px;

}



header p{

margin:8px 0 0;

font-size:17px;

}




.container{

max-width:650px;

margin:auto;

padding:15px;

}



/* PREMIUM ALL PRODUCT BUTTON */


.all-products-btn{

display:flex;

align-items:center;

justify-content:space-between;

gap:10px;

margin-bottom:20px;

padding:14px;

background:white;

border:2px solid #d4af37;

border-radius:18px;

text-decoration:none;

color:#111;

box-shadow:0 5px 15px rgba(0,0,0,.15);

transition:.3s;

}



.all-products-btn:hover{

transform:scale(1.03);

}





.btn-icon{


width:45px;

height:45px;

background:#111;

color:#d4af37;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;


}



.btn-text{


flex:1;

text-align:center;

font-size:16px;

font-weight:bold;

line-height:1.4;


}



.btn-arrow{


width:45px;

height:45px;

background:#d4af37;

color:#111;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:bold;


}





/* PRODUCT CARD */


.card{

background:white;

border-radius:16px;

padding:15px;

box-shadow:0 4px 15px rgba(0,0,0,.12);

}



/* IMAGE */


.product-image-box{

width:100%;

height:380px;

background:white;

border-radius:14px;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

border:1px solid #eee;

}



.product-image{

width:100%;

height:100%;

object-fit:contain;

}



.no-image{

font-size:18px;

color:#999;

}





/* PRODUCT INFO */


.product-name{


font-size:28px;

font-weight:bold;

margin-top:20px;


}



.product-description{


font-size:17px;

line-height:1.7;

color:#666;

margin-top:12px;


}



.product-price{


font-size:30px;

font-weight:bold;

margin-top:15px;


}






/* ORDER BUTTON */


.order-btn{


width:100%;

margin-top:25px;

padding:16px;

border:none;

border-radius:12px;

background:#111;

color:white;

font-size:20px;

font-weight:bold;

cursor:pointer;


}





/* SHARE BUTTON */


.share-box{

display:flex;

gap:8px;

margin-top:15px;

}



.share-box button{

flex:1;

padding:12px 5px;

border:none;

border-radius:10px;

color:white;

font-weight:bold;

font-size:14px;

}



.fb{

background:#1877f2;

}



.whatsapp{

background:#25d366;

}



.copy{

background:#555;

}




@media(max-width:600px){


.product-image-box{

height:320px;

}


.product-name{

font-size:24px;

}



}



</style>


</head>


<body>



<header>

<h1>
🛍️ SR Shopping BD
</h1>


<p>
Product Details
</p>


</header>



<div class="container">


<a href="index.html" class="all-products-btn">


<div class="btn-icon">

🛍️

</div>



<div class="btn-text">

এই ওয়েবসাইটের আরও সকল পণ্য<br>

দেখার জন্য ক্লিক করুন

</div>



<div class="btn-arrow">

→

</div>


</a>




<div class="card">


<div class="product-image-box">


<img id="productImage" class="product-image" style="display:none;">


<div id="noImage" class="no-image">

Image নেই

</div>


</div>





<h1 id="productName" class="product-name">

Product Name

</h1>




<div id="productDescription" class="product-description">

Product Description

</div>




<div class="product-price">

৳<span id="productPrice">

0

</span>

</div>





<button id="orderButton" class="order-btn">

🛒 ORDER NOW

</button>



<div class="share-box">


<button class="fb">

📘 Facebook

</button>



<button class="whatsapp">

🟢 WhatsApp

</button>



<button class="copy">

🔗 Copy

</button>



</div>



</div>
 

<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productData = null;





// ===============================
// GET PRODUCT NAME FROM LINK
// ===============================


const urlParams =

new URLSearchParams(

window.location.search

);



const selectedProduct =

urlParams.get("product") || "";









// ===============================
// LOAD PRODUCT FROM SHEET
// ===============================


function loadProduct(){



if(!selectedProduct){


showNotFound();

return;


}






let callbackName =

"productCallback_" + Date.now();






window[callbackName] = function(result){



delete window[callbackName];






if(

result &&

result.success === true

){



let products =

result.products || [];





productData =

products.find(function(item){



return item.name === selectedProduct;



});







if(productData){


showProduct();


}

else{


showNotFound();


}




}

else{


showNotFound();


}



};








let script =

document.createElement("script");





script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}











// ===============================
// GOOGLE DRIVE IMAGE CONVERTER
// ===============================


function convertImageURL(url){



if(!url){

return "";

}



url =

String(url).trim();






if(url.includes("thumbnail")){


return url;


}







let id = "";






let match =

url.match(

/\/file\/d\/([^\/]+)/

);





if(match && match[1]){


id = match[1];


}






if(!id){


match =

url.match(

/[?&]id=([^&]+)/

);



if(match && match[1]){


id = match[1];


}


}








if(id){



return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}






return url;



}











// ===============================
// SHOW PRODUCT
// ===============================


function showProduct(){



document.getElementById("productName")

.textContent =

productData.name || "";





document.getElementById("productDescription")

.textContent =

productData.description || "";






document.getElementById("productPrice")

.textContent =

Number(productData.price || 0)

.toLocaleString("en-BD");









let imageURL =

convertImageURL(

productData.image1

);







let img =

document.getElementById("productImage");





if(imageURL){



img.src = imageURL;






img.onload = function(){


img.style.display="block";


document.getElementById("noImage")

.style.display="none";


};






img.onerror=function(){


img.style.display="none";


document.getElementById("noImage")

.style.display="block";


};



}






// Facebook preview update


document.querySelector(

'meta[property="og:title"]'

)

.setAttribute(

"content",

productData.name

);





document.querySelector(

'meta[property="og:description"]'

)

.setAttribute(

"content",

productData.description || ""

);





document.querySelector(

'meta[property="og:image"]'

)

.setAttribute(

"content",

imageURL

);



}
 

// ===============================
// ORDER NOW
// ===============================


document
.getElementById("orderButton")
.addEventListener(
"click",
function(){



let image =

convertImageURL(

productData.image1

);






window.location.href =

"order.html?product="

+

encodeURIComponent(productData.name)

+

"&price="

+

encodeURIComponent(productData.price)

+

"&image="

+

encodeURIComponent(image);



});









// ===============================
// PRODUCT LINK
// ===============================


function getProductLink(){


return window.location.href;


}









// ===============================
// FACEBOOK SHARE
// ===============================


document
.querySelector(".fb")
.addEventListener(
"click",
function(){



window.open(


"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(
getProductLink()
),


"_blank"


);



});









// ===============================
// WHATSAPP SHARE
// ===============================


document
.querySelector(".whatsapp")
.addEventListener(
"click",
function(){



let message =


"🛍️ SR Shopping BD\n\n"

+

productData.name

+

"\n\nঅর্ডার করতে ভিজিট করুন:\n"

+

getProductLink();






window.open(


"https://wa.me/?text="

+

encodeURIComponent(message),


"_blank"


);



});









// ===============================
// COPY LINK
// ===============================


document
.querySelector(".copy")
.addEventListener(
"click",
function(){



navigator.clipboard.writeText(

getProductLink()

);



alert(

"Product Link Copy হয়েছে"

);



});









// ===============================
// PRODUCT NOT FOUND
// ===============================


function showNotFound(){



document.getElementById("productName")

.textContent =

"Product পাওয়া যায়নি";



document.getElementById("productDescription")

.textContent =

"এই পণ্যটি বর্তমানে পাওয়া যাচ্ছে না।";



}








// ===============================
// START
// ===============================


loadProduct();



</script>


</div>


</body>


</html>
