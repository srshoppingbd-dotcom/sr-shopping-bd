<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details - SR Shopping BD</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;

}


/* HEADER */

.header{

background:#111;
color:white;
text-align:center;
padding:15px 10px;

}


.header h1{

margin:0;
font-size:26px;

}


.header p{

margin:5px 0 0;
font-size:15px;

}




/* MAIN */

.container{

max-width:650px;
margin:auto;
padding:8px;

}




/* BACK */

.back{

display:block;
margin:8px 5px 12px;
text-decoration:none;
color:#111;
font-weight:bold;
font-size:18px;

}





/* ALL PRODUCT BUTTON */

.all-product-box{

margin-bottom:12px;
padding:12px;

background:white;

border:3px solid #d4af37;

border-radius:18px;

display:flex;

align-items:center;

justify-content:space-between;

box-shadow:0 4px 15px rgba(0,0,0,.15);

}



.shop-icon{

width:48px;
height:48px;

border-radius:50%;

background:#111;

display:flex;

align-items:center;

justify-content:center;

font-size:25px;

}



.all-text{

flex:1;

text-align:center;

font-size:17px;

font-weight:bold;

line-height:1.4;

}



.arrow-btn{

width:48px;
height:48px;

border-radius:50%;

background:#d4af37;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:bold;

}





/* PRODUCT CARD */

.card{

background:white;

border-radius:18px;

padding:10px;

box-shadow:0 4px 15px rgba(0,0,0,.12);

}




/* IMAGE */

.image-box{

height:180px;

width:100%;

border-radius:15px;

overflow:hidden;

background:white;

border:1px solid #ddd;

display:flex;

align-items:center;

justify-content:center;

}



.product-image{

width:100%;

height:100%;

object-fit:contain;

display:none;

transition:.3s;

}




.no-image{

font-size:16px;

color:#999;

}





/* ZOOM */

.zoom-controls{

display:flex;

gap:6px;

margin-top:8px;

}



.zoom-controls button{

flex:1;

padding:9px;

border:none;

border-radius:10px;

background:#222;

color:white;

font-size:15px;

font-weight:bold;

}
 /* PRODUCT DETAILS */


.product-title{

font-size:23px;

font-weight:bold;

line-height:1.3;

margin:12px 0 8px;

}



.description{

font-size:15px;

color:#666;

line-height:1.6;

}



.price{

font-size:30px;

font-weight:bold;

margin:12px 0;

color:#111;

}





/* ORDER BUTTON */


.order-btn{

width:100%;

padding:17px;

border:none;

border-radius:14px;

background:#111;

color:white;

font-size:21px;

font-weight:bold;

margin-top:8px;

cursor:pointer;

}





/* SHARE BUTTON */


.share-box{

display:flex;

gap:7px;

margin-top:10px;

}



.share-box button{

flex:1;

padding:12px 5px;

border:none;

border-radius:10px;

color:white;

font-size:13px;

font-weight:bold;

}



.facebook{

background:#1877f2;

}



.whatsapp{

background:#25d366;

}



.copy{

background:#555;

}





</style>


</head>



<body>



<div class="header">


<h1>

🛍️ SR Shopping BD

</h1>


<p>

Product Details

</p>


</div>





<div class="container">



<a href="index.html" class="back">

← সকল পণ্য দেখুন

</a>







<div class="all-product-box"

onclick="window.location.href='index.html'">



<div class="shop-icon">

🛍️

</div>




<div class="all-text">

এই ওয়েবসাইটের আরও সকল পণ্য<br>

দেখার জন্য ক্লিক করুন

</div>




<div class="arrow-btn">

➜

</div>




</div>









<div class="card">






<div class="image-box">



<img

id="productImage"

class="product-image"

>



<div id="noImage"

class="no-image">

Image নেই

</div>


</div>









<div class="zoom-controls">


<button onclick="zoomIn()">

+

</button>



<button onclick="zoomOut()">

−

</button>



<button onclick="resetZoom()">

Reset

</button>



</div>









<h1

id="productName"

class="product-title">

Product Name

</h1>






<p

id="productDescription"

class="description">

Description

</p>






<div class="price">

৳<span id="productPrice">

0

</span>

</div>








<button

id="orderBtn"

class="order-btn">

🛒 ORDER NOW

</button>








<div class="share-box">



<button

class="facebook"

onclick="shareFacebook()">

📘 Facebook

</button>





<button

class="whatsapp"

onclick="shareWhatsApp()">

🟢 WhatsApp

</button>





<button

class="copy"

onclick="copyLink()">

🔗 Copy

</button>



</div>



</div>






</div>
 <script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let currentProduct = {};

let zoomLevel = 1;





// GET PRODUCT NAME FROM LINK


const params =

new URLSearchParams(
window.location.search
);



let selectedProduct =

params.get("product") || "";









// GOOGLE DRIVE IMAGE FIX


function convertImageURL(url){


if(!url){

return "";

}



url = String(url).trim();



let id = "";



let match =

url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id = match[1];

}



if(!id){


match =

url.match(/[?&]id=([^&]+)/);



if(match && match[1]){

id = match[1];

}

}





if(id){


return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}



return url;


}









// LOAD PRODUCT


function loadProduct(){



let callbackName =

"productCallback_" + Date.now();





window[callbackName] = function(result){



delete window[callbackName];





if(result && result.success){



let products =

result.products || [];





let product =

products.find(function(item){



return String(item.name).trim()

===

String(selectedProduct).trim();



});






if(product){


currentProduct = product;


showProduct(product);


}

else{


document.getElementById("productName")

.innerHTML =

"Product পাওয়া যায়নি";


}



}



};








let script =

document.createElement("script");





script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}









// SHOW PRODUCT


function showProduct(product){



document.getElementById("productName")

.innerHTML =

product.name || "";





document.getElementById("productDescription")

.innerHTML =

product.description || "";





document.getElementById("productPrice")

.innerHTML =

Number(product.price || 0)

.toLocaleString("en-BD");






let img =

document.getElementById("productImage");






if(product.image1){



img.src =

convertImageURL(product.image1);






img.onload=function(){


img.style.display="block";


document.getElementById("noImage")

.style.display="none";


};



}









// ORDER BUTTON


document.getElementById("orderBtn")

.onclick=function(){



window.location.href =


"order.html?product="

+

encodeURIComponent(product.name)

+

"&price="

+

encodeURIComponent(product.price)

+

"&image="

+

encodeURIComponent(

convertImageURL(product.image1)

);



};





}









// ZOOM IN


function zoomIn(){



if(zoomLevel < 2.5){


zoomLevel += 0.2;


}



document.getElementById("productImage")

.style.transform =

"scale(" + zoomLevel + ")";


}









// ZOOM OUT


function zoomOut(){



if(zoomLevel > 1){


zoomLevel -= 0.2;


}



document.getElementById("productImage")

.style.transform =

"scale(" + zoomLevel + ")";


}









// RESET


function resetZoom(){



zoomLevel = 1;



document.getElementById("productImage")

.style.transform =

"scale(1)";


}









// SHARE


function getLink(){

return window.location.href;

}






function shareFacebook(){


window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(getLink()),

"_blank"

);


}






function shareWhatsApp(){



let text =

"🛍️ SR Shopping BD\n\n"

+

(currentProduct.name || "")

+

"\n\n"

+

getLink();






window.open(

"https://wa.me/?text="

+

encodeURIComponent(text),

"_blank"

);


}






function copyLink(){



navigator.clipboard.writeText(

getLink()

);



alert(

"Product Link Copy হয়েছে"

);


}







loadProduct();



</script>



</body>

</html>
