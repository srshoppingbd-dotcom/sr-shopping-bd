<!DOCTYPE html>

<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SR Shopping BD - Product Details</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}



.header{

background:#111;

color:white;

text-align:center;

padding:15px;

}



.header h1{

margin:0;

font-size:24px;

}



.header p{

margin:5px 0 0;

}




.container{

max-width:600px;

margin:auto;

padding:10px;

}




.all-products-btn{

display:flex;

align-items:center;

justify-content:center;

background:white;

border:2px solid #d4af37;

border-radius:15px;

padding:12px;

margin-bottom:12px;

text-decoration:none;

color:#111;

font-weight:bold;

}





.product-card{

background:white;

border-radius:16px;

padding:12px;

box-shadow:0 3px 12px rgba(0,0,0,.15);

}







/* IMAGE SLIDER */


.slider-box{

width:100%;

height:320px;

background:white;

border-radius:15px;

overflow:hidden;

position:relative;

border:1px solid #ddd;

}



.slider-track{

height:100%;

display:flex;

transition:0.35s ease;

}



.slider-track img{

width:100%;

height:100%;

flex-shrink:0;

object-fit:contain;

}





.slider-arrow{

position:absolute;

top:45%;

width:100%;

display:flex;

justify-content:space-between;

padding:0 10px;

}



.slider-arrow button{

width:38px;

height:38px;

border-radius:50%;

border:none;

background:#111;

color:white;

font-size:25px;

}





.dots{

text-align:center;

margin-top:10px;

}



.dot{

display:inline-block;

width:9px;

height:9px;

background:#ccc;

border-radius:50%;

margin:3px;

}



.dot.active{

background:#d4af37;

}





/* ZOOM */


.zoom-box{

display:flex;

gap:5px;

margin-top:10px;

}



.zoom-box button{

flex:1;

padding:8px;

border:none;

border-radius:8px;

background:#222;

color:white;

}





.product-name{

font-size:22px;

font-weight:bold;

margin-top:15px;

}





.product-description{

font-size:14px;

color:#666;

line-height:1.5;

margin-top:8px;

}





.product-price{

font-size:26px;

font-weight:bold;

margin:12px 0;

}






.order-btn{

width:100%;

padding:15px;

background:#111;

color:white;

border:2px solid #d4af37;

border-radius:12px;

font-size:20px;

font-weight:bold;

}





.share-buttons{

display:flex;

gap:6px;

margin-top:10px;

}



.share-buttons button{

flex:1;

padding:10px;

border:none;

border-radius:8px;

color:white;

font-weight:bold;

}



.facebook{

background:#1877f2;

}



.whatsapp{

background:#25d366;

}



.copy{

background:#555;

}


</style>

</head>


<body>


<div class="header">

<h1>🛍️ SR Shopping BD</h1>

<p>Product Details</p>

</div>



<div class="container">


<a href="index.html" class="all-products-btn">

🛍️ সকল পণ্য দেখতে ক্লিক করুন →

</a>



<div class="product-card">


<div class="slider-box">


<div id="sliderTrack" class="slider-track">

</div>


<div class="slider-arrow">

<button onclick="previousImage()">‹</button>

<button onclick="nextImage()">›</button>

</div>


</div>



<div id="dots" class="dots"></div>




<div class="zoom-box">

<button onclick="zoomIn()">+</button>

<button onclick="resetZoom()">Reset</button>

<button onclick="zoomOut()">−</button>

</div>





<div id="productName" class="product-name">

Loading...

</div>



<div id="productDescription" class="product-description">

</div>



<div class="product-price">

৳<span id="productPrice">0</span>

</div>



<button id="orderBtn" class="order-btn">

🛒 ORDER NOW

</button>



<div class="share-buttons">

<button class="facebook">

📘 FB

</button>


<button class="whatsapp">

🟢 WhatsApp

</button>


<button class="copy">

🔗 Copy

</button>

</div>


</div>


</div>
<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productData = {};

let imageList = [];

let currentIndex = 0;

let zoomLevel = 1;






// GET PRODUCT NAME


const urlParams =
new URLSearchParams(
window.location.search
);



let productNameURL =
urlParams.get("product") || "";







// IMAGE CONVERTER


function convertImageURL(url){


if(!url){

return "";

}



url =
String(url).trim();





if(url.includes("thumbnail")){

return url;

}





let id="";



let match =
url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id=match[1];

}





if(!id){


match =
url.match(/[?&]id=([^&]+)/);



if(match && match[1]){

id=match[1];

}


}




if(id){


return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1000";


}



return url;


}








// LOAD PRODUCT


function loadProduct(){


let callbackName =

"productCallback_"+Date.now();





window[callbackName]=function(result){



delete window[callbackName];




if(
result &&
result.success &&
result.product
){


productData =
result.product;


showProduct(
result.product
);



}

else{


document.getElementById(
"productName"
)
.innerHTML =
"Product পাওয়া যায়নি";


}



};







let script =
document.createElement("script");



script.src =

API_URL

+

"?action=singleProduct"

+

"&name="

+

encodeURIComponent(productNameURL)

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();






document.body.appendChild(script);



}








// SHOW PRODUCT


function showProduct(product){



document.getElementById(
"productName"
)
.innerHTML =
product.name || "";




document.getElementById(
"productDescription"
)
.innerHTML =
product.description || "";





document.getElementById(
"productPrice"
)
.innerHTML =

Number(
product.price || 0
)

.toLocaleString("en-BD");







// IMAGE COLLECTION


imageList = [];





// NEW FORMAT

if(
product.images &&
product.images.length
){


imageList =
product.images;


}





// FALLBACK OLD FORMAT


if(imageList.length === 0){



if(product.image1){

imageList.push(
product.image1
);

}



if(product.image2){

imageList.push(
product.image2
);

}



}






createSlider();





document.getElementById(
"orderBtn"
)
.onclick=function(){



window.location.href =

"order.html?product="

+

encodeURIComponent(product.name)

+

"&price="

+

encodeURIComponent(product.price)

+

"&image="

+

encodeURIComponent(
convertImageURL(
imageList[0]
)
);



};




}








// CREATE SLIDER


function createSlider(){



let track =
document.getElementById(
"sliderTrack"
);



let dots =
document.getElementById(
"dots"
);



track.innerHTML="";

dots.innerHTML="";





imageList.forEach(function(image,index){



let img =
document.createElement("img");



img.src =
convertImageURL(image);



track.appendChild(img);







let dot =
document.createElement("span");



dot.className =
"dot";



if(index===0){

dot.classList.add(
"active"
);

}



dot.onclick=function(){


goToImage(index);


};



dots.appendChild(dot);



});




updateSlider();



}








// MOVE SLIDER


function updateSlider(){



let track =
document.getElementById(
"sliderTrack"
);



track.style.transform =

"translateX(-"

+

(currentIndex*100)

+

"%)";






document.querySelectorAll(
".dot"
)
.forEach(function(dot,index){



if(index===currentIndex){


dot.classList.add(
"active"
);


}

else{


dot.classList.remove(
"active"
);


}



});



}







function nextImage(){



if(
currentIndex <
imageList.length-1
){


currentIndex++;


}



updateSlider();



}






function previousImage(){



if(currentIndex>0){


currentIndex--;


}



updateSlider();


}






function goToImage(index){



currentIndex=index;


updateSlider();



}






// ZOOM


function zoomIn(){



if(zoomLevel < 2.5){

zoomLevel +=0.2;

}


applyZoom();


}





function zoomOut(){



if(zoomLevel > 1){

zoomLevel -=0.2;

}



applyZoom();



}





function resetZoom(){


zoomLevel=1;


applyZoom();


}





function applyZoom(){



let img =
document.querySelector(
"#sliderTrack img"
);



if(img){


img.style.transform =

"scale("

+

zoomLevel

+

")";


}



}
// PRODUCT LINK

function getProductLink(){

return window.location.href;

}





// FACEBOOK SHARE

document
.querySelector(".facebook")
.onclick=function(){


window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(
getProductLink()
)

);



};






// WHATSAPP SHARE


document
.querySelector(".whatsapp")
.onclick=function(){



let text =

"🛍️ SR Shopping BD\n\n"

+

(productData.name || "")

+

"\n\n"

+

getProductLink();





window.open(

"https://wa.me/?text="

+

encodeURIComponent(text)

);



};







// COPY LINK


document
.querySelector(".copy")
.onclick=function(){



navigator.clipboard.writeText(

getProductLink()

);



alert(

"Product Link Copy হয়েছে"

);



};







// TOUCH SWIPE SUPPORT


let startX = 0;

let endX = 0;



const slider =
document.getElementById(
"sliderTrack"
);




slider.addEventListener(
"touchstart",
function(e){


startX =
e.touches[0].clientX;


});





slider.addEventListener(
"touchend",
function(e){


endX =
e.changedTouches[0].clientX;



if(
startX - endX > 50
){


nextImage();


}




if(
endX - startX > 50
){


previousImage();


}



});







// START


loadProduct();



</script>


</body>

</html>
