<!DOCTYPE html>

<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>SR Shopping BD - Product Details</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}



.header{

background:#111;

color:white;

text-align:center;

padding:16px 10px;

}


.header h1{

margin:0;

font-size:27px;

}


.header p{

margin:4px 0 0;

font-size:15px;

}





.container{

max-width:700px;

margin:auto;

padding:8px;

}




.back-btn{

display:block;

background:white;

border:2px solid #d4af37;

border-radius:18px;

padding:13px;

text-align:center;

font-size:19px;

font-weight:bold;

text-decoration:none;

color:#111;

margin-bottom:12px;

}





.product-card{

background:white;

border-radius:20px;

padding:10px;

box-shadow:0 4px 15px rgba(0,0,0,.12);

}




/* IMAGE SIZE REDUCED */


.slider-box{

width:100%;

height:320px;

background:white;

border-radius:15px;

overflow:hidden;

position:relative;

border:1px solid #ddd;

}





.slider-track{

display:flex;

height:100%;

transition:.4s ease;

}




.slider-track img{

min-width:100%;

height:100%;

object-fit:contain;

transition:.3s;

}




.arrow{

position:absolute;

top:50%;

transform:translateY(-50%);

width:52px;

height:52px;

border-radius:50%;

background:#111;

color:white;

border:none;

font-size:32px;

z-index:5;

}



.left{

left:12px;

}



.right{

right:12px;

}





.dots{

text-align:center;

padding:6px;

}



.dot{

display:inline-block;

width:11px;

height:11px;

background:#ccc;

border-radius:50%;

margin:4px;

}



.dot.active{

background:#d4af37;

}





.zoom-box{

display:flex;

gap:8px;

margin-top:8px;

}



.zoom-box button{

flex:1;

height:42px;

border:none;

border-radius:10px;

background:#111;

color:white;

font-size:18px;

font-weight:bold;

}





.product-name{

font-size:27px;

font-weight:bold;

margin-top:12px;

}



.product-description{

font-size:15px;

line-height:1.5;

color:#666;

margin-top:6px;

}



.product-price{

font-size:30px;

font-weight:bold;

margin-top:8px;

}



.order-btn{

width:100%;

height:58px;

margin-top:16px;

background:#111;

color:white;

border:2px solid #d4af37;

border-radius:15px;

font-size:22px;

font-weight:bold;

}
  
<div class="share">


<button class="fb">

📘 FB

</button>


<button class="wa">

🟢 WhatsApp

</button>


<button class="copy">

🔗 Copy

</button>


</div>


</div>


</div>


</div>




<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productData={};

let images=[];

let currentImage=0;

let zoom=1;





const params =

new URLSearchParams(
window.location.search
);



const productName =

params.get("product") || "";







function loadProduct(){


let callback =

"productCallback_"+Date.now();





window[callback]=function(data){



delete window[callback];





if(data.success && data.product){



productData=data.product;


showProduct();



}

else{


document.getElementById(
"productName"
).innerHTML=

"Product পাওয়া যায়নি";


}



};







let script=document.createElement("script");



script.src=

API_URL

+

"?action=singleProduct"

+

"&name="

+

encodeURIComponent(productName)

+

"&callback="

+

callback

+

"&time="

+

Date.now();





document.body.appendChild(script);



}








function showProduct(){



document.getElementById(
"productName"
).innerHTML=

productData.name || "";





document.getElementById(
"productDescription"
).innerHTML=

productData.description || "";





document.getElementById(
"productPrice"
).innerHTML=

Number(
productData.price || 0
)
.toLocaleString("en-BD");






images=[];






if(productData.images && Array.isArray(productData.images)){


images=productData.images;


}






if(images.length===0){



if(productData.image1){

images.push(productData.image1);

}



if(productData.image2){

images.push(productData.image2);

}



}







createSlider();






document.getElementById(
"orderBtn"
).onclick=function(){



window.location.href=

"order.html?product="

+

encodeURIComponent(productData.name)

+

"&price="

+

encodeURIComponent(productData.price)

+

"&image="

+

encodeURIComponent(images[0] || "");



};




}









function createSlider(){



let track=document.getElementById(
"sliderTrack"
);



let dots=document.getElementById(
"dots"
);



track.innerHTML="";

dots.innerHTML="";







if(images.length===0){



track.innerHTML=

`

<div class="loading">

Image পাওয়া যায়নি

</div>

`;

return;


}







images.forEach(function(url,index){



let img=document.createElement("img");



img.src=

String(url).trim();





img.onerror=function(){


this.style.display="none";


};





track.appendChild(img);






let dot=document.createElement("span");



dot.className="dot";



if(index===0){

dot.classList.add("active");

}



dot.onclick=function(){


goImage(index);


};



dots.appendChild(dot);



});






updateSlider();



}








function updateSlider(){



document.getElementById(
"sliderTrack"
)
.style.transform=

"translateX(-"

+

(currentImage*100)

+

"%)";






document.querySelectorAll(".dot")

.forEach(function(dot,index){



if(index===currentImage){


dot.classList.add("active");


}

else{


dot.classList.remove("active");


}



});



  }
  

function nextImage(){


if(currentImage < images.length-1){

currentImage++;

}


updateSlider();


}




function previousImage(){


if(currentImage > 0){

currentImage--;

}


updateSlider();


}





function goImage(index){


currentImage=index;


updateSlider();


}







// ZOOM


function zoomIn(){


if(zoom < 2.5){

zoom += 0.2;

}


applyZoom();


}





function zoomOut(){


if(zoom > 1){

zoom -= 0.2;

}


applyZoom();


}





function resetZoom(){


zoom=1;


applyZoom();


}





function applyZoom(){


document.querySelectorAll(

"#sliderTrack img"

)

.forEach(function(img){


img.style.transform=

"scale("+zoom+")";


});


}







// SWIPE SUPPORT


let startX=0;

let endX=0;



document

.getElementById("sliderTrack")

.addEventListener(

"touchstart",

function(e){


startX=e.touches[0].clientX;


}

);






document

.getElementById("sliderTrack")

.addEventListener(

"touchend",

function(e){


endX=e.changedTouches[0].clientX;




if(startX-endX>50){

nextImage();

}



if(endX-startX>50){

previousImage();

}



}

);








// SHARE



function getLink(){

return window.location.href;

}






document

.querySelector(".fb")

.onclick=function(){


window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(
getLink()
)

);


};







document

.querySelector(".wa")

.onclick=function(){


let text=

"🛍️ SR Shopping BD\n\n"

+

(productData.name || "")

+

"\n\n"

+

getLink();




window.open(

"https://wa.me/?text="

+

encodeURIComponent(text)

);



};






document

.querySelector(".copy")

.onclick=function(){


navigator.clipboard.writeText(

getLink()

);



alert(

"Product Link Copy হয়েছে"

);



};








// START


loadProduct();



</script>


</body>


</html>
