/* ALL PRODUCT BUTTON */

width:100%;

border-radius:12px;

.product-description{

}



.product-price{

/* ORDER BUTTON */

.share-buttons button{

}



.facebook{

background:#1877f2;

}


.whatsapp{

}

}





</style>


</head>



<body>



<div class="header">


<h1>

🛍️ SR Shopping BD

</h1>


<p>

Product Details

</p>


</div>





<div class="container">





<a href="index.html" class="all-products-btn">


<div class="btn-icon">

🛍️

</div>


<div class="btn-text">

এই ওয়েবসাইটের আরও সকল পণ্য<br>

<div class="product-card">

id="orderBtn"

class="order-btn">

<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let productData = {};

let zoomLevel = 1;





// PRODUCT NAME FROM LINK


const params =

new URLSearchParams(
window.location.search
);



let productNameURL =

params.get("product") || "";







// IMAGE CONVERTER


function convertImageURL(url){


if(!url){

return "";

}


url = String(url).trim();



let id = "";



let match =

url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id = match[1];

}





if(!id){


match =

url.match(/[?&]id=([^&]+)/);



if(match && match[1]){

id = match[1];

}


}






if(id){


return "https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}



return url;


}









// LOAD PRODUCT


function loadProduct(){



let callbackName =

"productCallback_" + Date.now();





window[callbackName] = function(result){



delete window[callbackName];






if(result && result.success){



let products =

result.products || [];






let found =

products.find(function(item){



return String(item.name).trim()

===

String(productNameURL).trim();



});






if(found){


productData = found;


showProduct(found);


}

else{


document.getElementById("productName")

.innerHTML =

"Product পাওয়া যায়নি";


}



}



};







let script =

document.createElement("script");



script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}









// SHOW PRODUCT


function showProduct(product){



document.getElementById("productName")

.innerHTML =

product.name || "";





document.getElementById("productDescription")

.innerHTML =

product.description || "";





document.getElementById("productPrice")

.innerHTML =

Number(product.price || 0)

.toLocaleString("en-BD");







// IMAGE


if(product.image1){



let img =

document.getElementById("productImage");





img.src =

convertImageURL(product.image1);






img.onload=function(){



img.style.display="block";


document.getElementById("noImage")

.style.display="none";


};





img.onerror=function(){


img.style.display="none";


document.getElementById("noImage")

.innerHTML=

"Image পাওয়া যায়নি";


};



}







// ORDER


document.getElementById("orderBtn")

.onclick=function(){



window.location.href =


"order.html?product="

+

encodeURIComponent(product.name)

+

"&price="

+

encodeURIComponent(product.price)

+

"&image="

+

encodeURIComponent(

convertImageURL(product.image1)

);



};



}









// ZOOM


function zoomIn(){


if(zoomLevel < 2.5){

zoomLevel += 0.2;

}


document.getElementById("productImage")

.style.transform =

"scale("+zoomLevel+")";


}





function zoomOut(){



if(zoomLevel > 1){

zoomLevel -= 0.2;

}


document.getElementById("productImage")

.style.transform =

"scale("+zoomLevel+")";


}





function resetZoom(){



zoomLevel = 1;


document.getElementById("productImage")

.style.transform =

"scale(1)";


}









// SHARE LINK


function getProductLink(){

return window.location.href;

}






document

.querySelector(".facebook")

.onclick=function(){


window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(getProductLink())

);


};








document

.querySelector(".whatsapp")

.onclick=function(){



let text =

"🛍️ SR Shopping BD\n\n"

+

(productData.name || "")

+

"\n\n"

+

getProductLink();





window.open(

"https://wa.me/?text="

+

encodeURIComponent(text)

);


};








document

.querySelector(".copy")

.onclick=function(){



navigator.clipboard.writeText(

getProductLink()

);



alert(

"Product Link Copy হয়েছে"

);



};








// START


loadProduct();



</script>



</body>
