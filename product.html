<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Product Details - SR Shopping BD</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:Arial,sans-serif;

background:#f5f5f5;

color:#222;

}



/* HEADER */

.header{

background:#111;

color:white;

text-align:center;

padding:18px 10px;

}



.header h1{

margin:0;

font-size:26px;

}


.header p{

margin:6px 0 0;

}




/* ALL PRODUCT BUTTON */


.all-product-box{


margin:15px 12px;


background:white;


border:3px solid #d4af37;


border-radius:20px;


padding:14px;


display:flex;

justify-content:space-between;

}



.shop-icon{


width:55px;

height:55px;

justify-content:center;

}



.all-product-text{

text-align:center;

font-size:18px;

font-weight:bold;

line-height:1.5;

flex:1;

padding:0 10px;

}




.arrow-btn{


width:55px;

height:55px;

border-radius:50%;


background:#d4af37;


display:flex;

align-items:center;

justify-content:center;


font-size:30px;

font-weight:bold;

/* MAIN CARD */


.container{

padding:10px;

max-width:650px;

margin:auto;

}



.card{


background:white;


border-radius:18px;


padding:12px;


box-shadow:0 4px 15px rgba(0,0,0,.12);


}





/* IMAGE */


.image-box{


height:240px;


width:100%;


border-radius:15px;


overflow:hidden;


background:#fff;


border:1px solid #eee;


display:flex;


align-items:center;


justify-content:center;


}



.product-image{


width:100%;


height:100%;


object-fit:contain;


display:none;


}



.no-image{


color:#999;

font-size:18px;


}






/* PRODUCT INFO */


.product-title{


font-size:26px;


font-weight:bold;


margin-top:15px;


line-height:1.3;


}




.description{


font-size:17px;


color:#666;

margin-top:10px;


}




.price{


font-size:32px;


font-weight:bold;


margin:15px 0;


}






/* ORDER BUTTON */


.order-btn{


width:100%;


padding:15px;


border:none;


border-radius:12px;


background:#111;


color:white;


font-size:20px;


font-weight:bold;


cursor:pointer;


}






/* SHARE */


.share-box{


display:flex;


gap:8px;


margin-top:12px;


}


.share-box button{


flex:1;


padding:12px 5px;


border:none;


border-radius:10px;

}


.facebook{

background:#1877f2;

}


.whatsapp{

background:#25d366;

}

}



</style>


</head>



<body>


<div class="header">


<h1>🛍️ SR Shopping BD</h1>


<p>Product Details</p>


</div>





<div class="all-product-box"


onclick="window.location.href='index.html'">


<div class="shop-icon">

🛍️

</div>



<div class="all-product-text">

এই ওয়েবসাইটের আরও সকল পণ্য<br>

দেখার জন্য ক্লিক করুন

</div>




<div class="arrow-btn">

→

</div>


</div>





<div class="container">


<div class="card">



<div class="image-box">


<img

id="productImage"

class="product-image"

>


<div id="noImage"

class="no-image">

Image নেই

</div>



</div>





<h1 id="productName"

class="product-title">

Product Name

</h1>




<div id="productDescription"

class="description">

</div>




<div class="price">

৳<span id="productPrice">

0

</span>

</div>



<button

id="orderBtn"

class="order-btn">

🛒 ORDER NOW

</button>



<div class="share-box">


<button class="facebook">

📘 Facebook

</button>


<button class="whatsapp">

🟢 WhatsApp

</button>


<button class="copy">

🔗 Copy

</button>



</div>



</div>


</div>
 <script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwEl4AmzhQHDoy0yMqE0_XnUJ2Yj65-PiWnP0FADuC5Wh5Y8d8fej2lUBqndiQC2bN5/exec";



let currentProduct = {};




// =============================
// GET PRODUCT NAME
// =============================


const params =
new URLSearchParams(
window.location.search
);



let selectedProduct =

params.get("product") || "";





// =============================
// DRIVE IMAGE FIX
// =============================


function convertImageURL(url){


if(!url){

return "";

}



url = String(url).trim();



let id="";



let match =
url.match(/\/file\/d\/([^\/]+)/);



if(match && match[1]){

id=match[1];

}




if(!id){


match =
url.match(/[?&]id=([^&]+)/);


if(match && match[1]){

id=match[1];

}


}




if(id){


return

"https://drive.google.com/thumbnail?id="

+

id

+

"&sz=w1200";


}



return url;


}









// =============================
// LOAD PRODUCT DATA
// =============================


function loadProduct(){



let callbackName =

"product_" + Date.now();






window[callbackName] = function(result){



delete window[callbackName];






if(
result &&
result.success
){



let products =

result.products || [];





let product =

products.find(function(item){



return String(item.name).trim()

===

String(selectedProduct).trim();



});







if(product){



currentProduct = product;



showProduct(product);



}

else{


document.getElementById("productName")
.innerHTML =

"Product পাওয়া যায়নি";


}



}



};








let script =

document.createElement("script");



script.src =

API_URL

+

"?action=products"

+

"&callback="

+

callbackName

+

"&time="

+

Date.now();





document.body.appendChild(script);



}









// =============================
// SHOW PRODUCT
// =============================


function showProduct(product){



document.getElementById("productName")
.innerHTML =

product.name || "";






document.getElementById("productDescription")
.innerHTML =

product.description || "";






document.getElementById("productPrice")
.innerHTML =


Number(product.price || 0)

.toLocaleString("en-BD");







if(product.image1){



let img =

document.getElementById("productImage");



img.src =

convertImageURL(product.image1);





img.onload=function(){


img.style.display="block";


document.getElementById("noImage")
.style.display="none";


};





img.onerror=function(){


img.style.display="none";


document.getElementById("noImage")
.innerHTML=

"Image পাওয়া যায়নি";


};



}







// ORDER BUTTON



document
.getElementById("orderBtn")
.onclick=function(){



window.location.href =


"order.html?product="

+

encodeURIComponent(product.name)

+

"&price="

+

encodeURIComponent(product.price)

+

"&image="

+

encodeURIComponent(

convertImageURL(product.image1)

);



};




}






// START


loadProduct();



 </script>
 <script>


// =============================
// GET PRODUCT LINK
// =============================


function getProductLink(){

return window.location.href;

}






// =============================
// FACEBOOK SHARE
// =============================


document
.querySelector(".facebook")
.addEventListener(
"click",
function(){



window.open(

"https://www.facebook.com/sharer/sharer.php?u="

+

encodeURIComponent(
getProductLink()
),

"_blank"

);



});









// =============================
// WHATSAPP SHARE
// =============================


document
.querySelector(".whatsapp")
.addEventListener(
"click",
function(){



let message =


"🛍️ SR Shopping BD\n\n"

+

(currentProduct.name || "")

+

"\n\nঅর্ডার করতে ক্লিক করুন:\n"

+

getProductLink();






window.open(

"https://wa.me/?text="

+

encodeURIComponent(message),

"_blank"

);



});









// =============================
// COPY LINK
// =============================


document
.querySelector(".copy")
.addEventListener(
"click",
function(){



navigator.clipboard.writeText(

getProductLink()

);



alert(

"Product Link Copy হয়েছে"

);



});







</script>
